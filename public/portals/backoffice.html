<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Back-Office Console – Sohar International</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="app-shell" id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <svg class="sidebar-logo-mark" viewBox="0 0 520 120" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(10 16)">
          <path d="M12 82c27-7 47-27 54-53 6-17 18-29 35-38-5 31-17 58-37 77-16 15-34 22-52 24z" fill="#35c6c4"/>
          <path d="M8 85c31-9 57-30 76-59 11-17 22-27 35-35-10 28-24 52-45 70-18 15-39 23-66 27z" fill="#f4b35b" opacity=".9"/>
        </g>
      </svg>
      <div class="sidebar-logo-text">sohar international<small>Back-Office Console</small></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" id="userAvatar">FA</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="userName">Fatima Al-Rashdi</div>
          <div class="sidebar-user-role" id="userRole">Product Management</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <header class="topbar">
      <span class="topbar-title" id="pageTitle">Products</span>
      <span class="topbar-subtitle" id="pageSubtitle"></span>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <!-- Role switcher -->
        <div class="portal-switch">
          <button class="portal-switch-btn active" onclick="switchRole('product_manager')" id="role-pm">Product Manager</button>
          <button class="portal-switch-btn" onclick="switchRole('compliance_officer')" id="role-co">Compliance</button>
          <button class="portal-switch-btn" onclick="switchRole('risk_officer')" id="role-ro">Risk</button>
          <button class="portal-switch-btn" onclick="switchRole('operations')" id="role-ops">Operations</button>
        </div>
        <div class="lang-toggle">
          <button class="lang-btn active" onclick="setLang('en')">EN</button>
          <button class="lang-btn" onclick="setLang('ar')">ع</button>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="window.location='/'"><i class="fas fa-th"></i></button>
        <div style="position:relative">
          <button class="btn btn-ghost btn-sm"><i class="fas fa-bell"></i></button>
          <span class="badge-count" style="position:absolute;top:-4px;right:-4px">3</span>
        </div>
      </div>
    </header>
    <main class="main-content" id="mainContent">
      <div class="page"><div class="empty-state"><div class="spinner-lg"></div><p>Loading…</p></div></div>
    </main>
  </div>
</div>

<!-- SLIDE PANEL (product detail / application detail) -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>
<div class="slide-panel" id="slidePanel">
  <div class="slide-panel-header">
    <h3 id="panelTitle">Detail</h3>
    <button class="close-btn" onclick="closePanel()"><i class="fas fa-times"></i></button>
  </div>
  <div class="slide-panel-body" id="panelBody"></div>
</div>

<div id="toastContainer" style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;"></div>
<div id="modalContainer"></div>

<script>
/* ======================== STATE ======================== */
const API = '';
let currentRole = 'product_manager';
let currentLang = 'en';
let selectedProduct = null;
let selectedTab = 'general';
let products = [];
let rules = [];
let auditLogs = [];
let applications = [];

const ROLES = {
  product_manager: { name:'Fatima Al-Rashdi', nameAr:'فاطمة الراشدي', dept:'Product Management', avatar:'FA',
    nav:['products','rules','workflows','compliance_config','audit_logs'] },
  compliance_officer: { name:'Aisha Al-Balushi', nameAr:'عائشة البلوشي', dept:'Compliance & ESG', avatar:'AB',
    nav:['tasks','esg_review','regulatory_reports','audit_logs','aml_alerts'] },
  risk_officer: { name:'Omar Al-Mantheri', nameAr:'عمر المنذري', dept:'Credit Risk', avatar:'OM',
    nav:['tasks','credit_review','stress_tests','regulatory_reports','audit_logs'] },
  operations: { name:'Khalid Al-Rawahi', nameAr:'خالد الرواحي', dept:'Operations', avatar:'KR',
    nav:['escrow','disbursements','audit_logs'] }
};

const NAV_ITEMS = {
  products:           { icon:'fa-box', label:'Products', labelAr:'المنتجات' },
  rules:              { icon:'fa-gavel', label:'Rules Engine', labelAr:'محرك القواعد' },
  workflows:          { icon:'fa-sitemap', label:'Workflows', labelAr:'سير العمل' },
  compliance_config:  { icon:'fa-shield-halved', label:'Compliance', labelAr:'الامتثال' },
  audit_logs:         { icon:'fa-list-check', label:'Audit Logs', labelAr:'سجلات التدقيق' },
  tasks:              { icon:'fa-inbox', label:'Tasks', labelAr:'المهام' },
  esg_review:         { icon:'fa-leaf', label:'ESG Review', labelAr:'مراجعة ESG' },
  regulatory_reports: { icon:'fa-file-chart-pie', label:'Regulatory Reports', labelAr:'التقارير التنظيمية' },
  aml_alerts:         { icon:'fa-triangle-exclamation', label:'AML Alerts', labelAr:'تنبيهات غسل الأموال' },
  credit_review:      { icon:'fa-chart-bar', label:'Credit Review', labelAr:'مراجعة الائتمان' },
  stress_tests:       { icon:'fa-vials', label:'Stress Tests', labelAr:'اختبارات الضغط' },
  escrow:             { icon:'fa-vault', label:'Escrow & Disbursement', labelAr:'الضمان والصرف' },
  disbursements:      { icon:'fa-money-bill-transfer', label:'Disbursements', labelAr:'الصرفيات' }
};

/* ======================== INIT ======================== */
window.onload = async () => {
  renderSidebar();
  await loadProducts();
  renderPage('products');
};

const ROLE_BTN_ID = {
  product_manager: 'role-pm',
  compliance_officer: 'role-co',
  risk_officer: 'role-ro',
  operations: 'role-ops'
};

function switchRole(role) {
  currentRole = role;
  document.querySelectorAll('.portal-switch-btn').forEach(b => b.classList.remove('active'));
  const btnId = ROLE_BTN_ID[role];
  if (btnId) document.getElementById(btnId)?.classList.add('active');
  const r = ROLES[role];
  document.getElementById('userAvatar').textContent = r.avatar;
  document.getElementById('userName').textContent = currentLang==='ar' ? r.nameAr : r.name;
  document.getElementById('userRole').textContent = r.dept;
  renderSidebar();
  const firstNav = ROLES[role].nav[0];
  renderPage(firstNav);
}

function setLang(lang) {
  currentLang = lang;
  const isAr = lang === 'ar';
  document.body.style.direction = isAr ? 'rtl' : 'ltr';
  document.documentElement.setAttribute('dir', isAr ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', isAr ? 'ar' : 'en');
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent.trim()===(isAr?'ع':'EN')));
  // Update all data-en/data-ar text nodes
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = isAr ? (el.getAttribute('data-ar') || el.getAttribute('data-en')) : el.getAttribute('data-en');
  });
  renderSidebar();
  const r = ROLES[currentRole];
  document.getElementById('userName').textContent = isAr ? r.nameAr : r.name;
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  const items = ROLES[currentRole].nav;
  nav.innerHTML = items.map(key => {
    const item = NAV_ITEMS[key];
    return `<div class="sidebar-item" onclick="renderPage('${key}')" id="nav-${key}">
      <i class="fas ${item.icon}"></i>
      <span>${currentLang==='ar' ? item.labelAr : item.label}</span>
    </div>`;
  }).join('');
}

function setActiveNav(key) {
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-'+key)?.classList.add('active');
}

/* ======================== PAGE ROUTER ======================== */
async function renderPage(page) {
  setActiveNav(page);
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="page"><div class="empty-state"><i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--grey-300)"></i></div></div>';
  
  switch(page) {
    case 'products': await renderProducts(); break;
    case 'rules': await renderRules(); break;
    case 'audit_logs': await renderAuditLogs(); break;
    case 'tasks': await renderComplianceTasks(); break;
    case 'esg_review': await renderEsgReview(); break;
    case 'credit_review': await renderCreditReview(); break;
    case 'escrow': await renderEscrow(); break;
    case 'regulatory_reports': await renderReports(); break;
    default: {
      const pageLabel = NAV_ITEMS[page] ? (currentLang==='ar' ? NAV_ITEMS[page].labelAr : NAV_ITEMS[page].label) : page.replace(/_/g,' ');
      document.getElementById('pageTitle').textContent = pageLabel;
      document.getElementById('pageSubtitle').textContent = '';
      main.innerHTML = renderEmptySection(page, pageLabel);
    }
  }
}

/* ======================== EMPTY SECTION PLACEHOLDER ======================== */
function renderEmptySection(page, label) {
  const SECTION_META = {
    workflows: {
      icon: 'fa-sitemap',
      title: currentLang==='ar' ? 'إدارة سير العمل' : 'Workflow Management',
      desc: currentLang==='ar' ? 'تكوين مسارات الموافقة والمراجعة متعددة المستويات.' : 'Configure multi-stage approval and review paths for loan processing.',
      items: currentLang==='ar' ? ['مراجعة الامتثال والمخاطر','موافقة مدير المنتج','سير عمل ESG مزدوج','مراجعة المكتب الإقليمي'] : ['Compliance & Risk dual review','Product Manager sign-off','ESG dual-approval workflow','Regional desk review']
    },
    compliance_config: {
      icon: 'fa-shield-halved',
      title: currentLang==='ar' ? 'إعدادات الامتثال' : 'Compliance Configuration',
      desc: currentLang==='ar' ? 'ضبط معايير الامتثال ومتطلبات مكافحة غسيل الأموال وقواعد PDPL.' : 'Manage AML thresholds, PDPL data handling rules, and CBO regulatory parameters.',
      items: currentLang==='ar' ? ['عتبات مكافحة غسل الأموال','قواعد حماية البيانات PDPL','معايير الامتثال للبنك المركزي','إعداد المراجعة الدورية'] : ['AML screening thresholds','PDPL data retention rules','CBO parameter governance','Periodic review cadence']
    },
    aml_alerts: {
      icon: 'fa-triangle-exclamation',
      title: currentLang==='ar' ? 'تنبيهات مكافحة غسل الأموال' : 'AML Alerts',
      desc: currentLang==='ar' ? 'مراجعة حالات التحقق من العناية الواجبة المحسّنة وتنبيهات المعاملات المشبوهة.' : 'Review enhanced due-diligence cases and suspicious transaction alerts raised by the screening engine.',
      items: currentLang==='ar' ? ['فحص العملاء','تنبيهات المعاملات المشبوهة','قوائم العقوبات الدولية','مراجعة البيانات البيومترية'] : ['Customer screening queue','Suspicious transaction alerts','Sanctions list matches','PEP & adverse media flags']
    },
    stress_tests: {
      icon: 'fa-vials',
      title: currentLang==='ar' ? 'اختبارات الضغط' : 'Stress Test Scenarios',
      desc: currentLang==='ar' ? 'تشغيل وتحليل سيناريوهات ضغط محفظة الائتمان وفق متطلبات البنك المركزي.' : 'Run and analyse credit portfolio stress scenarios per CBO capital adequacy requirements.',
      items: currentLang==='ar' ? ['ارتفاع معدل الفائدة 350 نقطة أساس','انخفاض أسعار العقارات 30%','تدهور نسبة عبء الديون','سيناريوهات الانكماش الاقتصادي'] : ['Rate shock +350bps','Property price decline −30%','DBR deterioration scenario','Macro downturn sensitivity']
    },
    disbursements: {
      icon: 'fa-money-bill-transfer',
      title: currentLang==='ar' ? 'الصرفيات' : 'Disbursement Queue',
      desc: currentLang==='ar' ? 'إدارة طوابير الصرف والمدفوعات للمقاولين والموردين المعتمدين.' : 'Manage contractor payment queues, approved tranche releases, and supplier fund transfers.',
      items: currentLang==='ar' ? ['مدفوعات الشرائح المعتمدة','حسابات الضمان','تحويلات المقاولين','طلبات الدفع المعلقة'] : ['Approved tranche queue','Escrow account settlements','Contractor fund transfers','Pending payment requests']
    }
  };
  const meta = SECTION_META[page] || {
    icon: 'fa-layer-group',
    title: label,
    desc: currentLang==='ar' ? 'هذا القسم متاح لمستخدمي الدور المناسب.' : 'This section is available to users with the appropriate role assignment.',
    items: []
  };
  return `<div class="page">
    <div style="max-width:640px;margin:0 auto;padding:2rem 1rem">
      <div style="width:64px;height:64px;border-radius:16px;background:rgba(0,127,134,.1);display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem">
        <i class="fas ${meta.icon}" style="font-size:1.6rem;color:var(--teal)"></i>
      </div>
      <h2 style="margin-bottom:.5rem;color:var(--navy)">${meta.title}</h2>
      <p style="color:var(--grey-500);font-size:.9rem;line-height:1.6;margin-bottom:1.5rem">${meta.desc}</p>
      ${meta.items.length ? `
      <div style="background:var(--grey-100);border-radius:var(--radius-md);padding:1rem">
        <div style="font-size:.75rem;font-weight:600;color:var(--grey-500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.75rem">${currentLang==='ar'?'الميزات الرئيسية':'Key capabilities'}</div>
        <ul style="list-style:none;display:flex;flex-direction:column;gap:.5rem">
          ${meta.items.map(item=>`<li style="display:flex;align-items:center;gap:.625rem;font-size:.85rem"><i class="fas fa-check-circle" style="color:var(--teal);font-size:.75rem;flex-shrink:0"></i>${item}</li>`).join('')}
        </ul>
      </div>` : ''}
    </div>
  </div>`;
}

/* ======================== PRODUCTS PAGE ======================== */
async function loadProducts() {
  try {
    const r = await fetch('/api/v1/products');
    const d = await r.json();
    products = d.products || [];
  } catch(e) { products = []; }
}

async function renderProducts() {
  document.getElementById('pageTitle').textContent = currentLang==='ar' ? 'المنتجات' : 'Products';
  document.getElementById('pageSubtitle').textContent = `${products.length} products`;
  
  const statusColor = {active:'badge-active', draft:'badge-draft', archived:'badge-archived'};
  const categoryIcon = {home_loan:'fa-house', auto_loan:'fa-car', personal_loan:'fa-user', sme:'fa-briefcase', commercial:'fa-building', education:'fa-graduation-cap'};

  const html = `<div class="page">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">
      <div>
        <h2>${currentLang==='ar'?'مكتبة المنتجات':'Product Library'}</h2>
        <p style="margin-top:.25rem">${currentLang==='ar'?'المنتجات المصرفية النشطة والمسودة':'Active and draft banking products'}</p>
      </div>
      <div style="display:flex;gap:.5rem;">
        <div class="search-bar" style="width:220px">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search products…" oninput="filterProducts(this.value)">
        </div>
        <button class="btn btn-primary" onclick="showCloneModal()"><i class="fas fa-copy"></i> Clone Product</button>
        <button class="btn btn-navy" onclick="showNewProductModal()"><i class="fas fa-plus"></i> New Product</button>
      </div>
    </div>

    <!-- Metrics row -->
    <div class="metric-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:1.5rem;">
      <div class="metric-card"><div class="metric-value">${products.filter(p=>p.status==='active').length}</div><div class="metric-label">Active Products</div></div>
      <div class="metric-card"><div class="metric-value">${products.reduce((s,p)=>s+(p.applications_ytd||0),0).toLocaleString()}</div><div class="metric-label">Applications YTD</div></div>
      <div class="metric-card"><div class="metric-value">${products.filter(p=>p.status==='draft').length}</div><div class="metric-label">In Draft</div></div>
      <div class="metric-card"><div class="metric-value">15</div><div class="metric-label">CBO Rules Active</div></div>
    </div>

    <div class="product-grid" id="productGrid">
      ${products.map(p => `
        <div class="product-card ${p.category==='home_loan'&&p.esg_required_docs&&p.esg_required_docs!=='[]'?'green':''}" onclick="openProductDetail('${p.id}')">
          <div class="product-card-header">
            <div>
              <div class="product-card-title"><i class="fas ${categoryIcon[p.category]||'fa-file'}" style="color:var(--teal);margin-right:.4rem;font-size:.8rem"></i>${p.name}</div>
              <div class="product-card-meta">${p.category.replace(/_/g,' ')}</div>
            </div>
            <span class="badge ${statusColor[p.status]||'badge-draft'}">${p.status}</span>
          </div>
          ${p.esg_required_docs && p.esg_required_docs!=='[]' ? '<span class="badge badge-esg" style="margin-bottom:.5rem"><i class="fas fa-leaf"></i> ESG Product</span>' : ''}
          <p style="font-size:.78rem;color:var(--grey-500);margin:.5rem 0;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${p.description||''}</p>
          <div class="product-card-stats">
            <div class="product-stat"><strong>${p.base_rate||5.5}%</strong>Base Rate</div>
            <div class="product-stat"><strong>${(p.applications_ytd||0).toLocaleString()}</strong>Apps YTD</div>
            <div class="product-stat"><strong>${p.max_ltv||90}%</strong>Max LTV</div>
          </div>
        </div>
      `).join('')}
    </div>
  </div>`;
  
  document.getElementById('mainContent').innerHTML = html;
}

function filterProducts(q) {
  document.querySelectorAll('.product-card').forEach(card => {
    const name = card.querySelector('.product-card-title').textContent.toLowerCase();
    card.style.display = name.includes(q.toLowerCase()) ? '' : 'none';
  });
}

/* ======================== PRODUCT DETAIL PANEL ======================== */
async function openProductDetail(id) {
  selectedProduct = id;
  openPanel('Loading product…');
  try {
    const r = await fetch(`/api/v1/products/${id}`);
    const d = await r.json();
    const p = d.product;
    const productRules = d.rules || [];
    renderProductPanel(p, productRules);
  } catch(e) { document.getElementById('panelBody').innerHTML = '<p>Error loading product</p>'; }
}

function renderProductPanel(p, productRules) {
  document.getElementById('panelTitle').textContent = p.name;
  const tabs = ['general','pricing','eligibility','documents','workflow','ai_config','ai_assistant'];
  const tabLabels = {general:'General',pricing:'Pricing',eligibility:'Eligibility',documents:'Document Requirements',workflow:'Workflow',ai_config:'AI Config',ai_assistant:'🤖 AI Assistant'};
  
  const esgDocs = (() => { try { return JSON.parse(p.esg_required_docs||'[]'); } catch{return[];} })();
  const reqDocs = (() => { try { return JSON.parse(p.required_docs||'[]'); } catch{return[];} })();
  const materials = (() => { try { return JSON.parse(p.approved_materials||'[]'); } catch{return[];} })();
  const vendors = (() => { try { return JSON.parse(p.approved_vendors||'[]'); } catch{return[];} })();

  const tabContent = {
    general: `
      <div class="form-row">
        <div class="form-group"><label class="form-label">Product Name</label><input class="form-control" value="${p.name}" id="pName"></div>
        <div class="form-group"><label class="form-label">Category</label><input class="form-control" value="${p.category}" disabled></div>
      </div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-control" rows="3" id="pDesc">${p.description||''}</textarea></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Min Term (years)</label><input class="form-control" type="number" value="${p.min_term}" id="pMinTerm"></div>
        <div class="form-group"><label class="form-label">Max Term (years)</label><input class="form-control" type="number" value="${p.max_term}" id="pMaxTerm"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Min Amount (OMR)</label><input class="form-control" type="number" value="${p.min_amount}"></div>
        <div class="form-group"><label class="form-label">Max Amount (OMR)</label><input class="form-control" type="number" value="${p.max_amount}"></div>
      </div>
      <div style="display:flex;gap:.75rem;margin-top:.5rem">
        <span class="badge ${p.status==='active'?'badge-active':'badge-draft'}">${p.status}</span>
        ${p.esg_required_docs&&p.esg_required_docs!=='[]'?'<span class="badge badge-esg"><i class="fas fa-leaf"></i> ESG Product</span>':''}
      </div>`,

    pricing: `
      <div class="card" style="margin-bottom:1rem">
        <div class="card-header"><h4>Base Rate Configuration</h4></div>
        <div class="card-body">
          <div class="form-row">
            <div class="form-group"><label class="form-label">Base Rate (%)</label><input class="form-control" type="number" step=".01" value="${p.base_rate||5.5}" id="pRate"></div>
            <div class="form-group"><label class="form-label">Max DBR (%)</label><input class="form-control" type="number" value="${p.max_dbr||60}"></div>
          </div>
        </div>
      </div>
      ${esgDocs.length ? `
      <div class="card" style="border-left:4px solid var(--success)">
        <div class="card-header" style="background:var(--success-light)">
          <h4 style="color:var(--success)"><i class="fas fa-leaf"></i> ESG Pricing Modifiers</h4>
          <button class="btn btn-sm btn-success" onclick="toast('ESG modifier saved','success')"><i class="fas fa-save"></i> Save</button>
        </div>
        <div class="card-body">
          <div style="background:var(--grey-100);border-radius:var(--radius-md);overflow:hidden">
            <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;padding:.5rem .75rem;font-size:.7rem;font-weight:600;color:var(--grey-500);text-transform:uppercase;border-bottom:1px solid var(--grey-200)">
              <span>Condition</span><span>Discount</span><span>Applied Rate</span><span>Action</span>
            </div>
            <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;padding:.625rem .75rem;font-size:.82rem;border-bottom:1px solid var(--grey-100);align-items:center">

const EXAMPLE_PROMPTS = {
  dbr: 'The Central Bank of Oman requires that for all housing loans, the Debt Burden Ratio (DBR) shall not exceed 60% of the applicant\'s gross monthly income. For green financing products, banks are encouraged to apply a 5% buffer, effectively limiting DBR to 55%.',
  gsas: 'GSAS certificates issued under OS GSO 3000:2025 must contain: Certificate Number (alphanumeric, 12 characters), Issuer (GORD or accredited body), Issue Date, Expiry Date (valid for 5 years), Overall Score (0-100), and Rating (Bronze/Silver/Gold/Platinum). The certificate must be valid for at least 90 days from the application date.'
};

function fillDemoPrompt(type) {
  document.getElementById('aiPromptTA').value = EXAMPLE_PROMPTS[type];
}

async function runAiAssistant(productId) {
  const prompt = document.getElementById('aiPromptTA').value.trim();
  if (!prompt) return toast('Please enter a regulatory text prompt','error');
  
  const resp = document.getElementById('aiResponse');
  resp.innerHTML = `<div class="ai-response"><div class="ai-thinking"><div class="ai-thinking-dots"><span>●</span><span>●</span><span>●</span></div> Analyzing regulatory text… Extracting parameters… Generating rules…</div></div>`;
  
  try {
    const r = await fetch('/api/v1/ai/rules/generate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text: prompt, product_id: productId, user_id:'u001', user_name:'Fatima Al-Rashdi' })
    });
    const d = await r.json();
    renderAiResponse(d, productId);
  } catch(e) {
    resp.innerHTML = '<div class="ai-response" style="color:rgba(255,255,255,.6)">Error calling AI. Check API key configuration.</div>';
  }
}

function renderAiResponse(data, productId) {
  const rules = data.rules || [];
  const resp = document.getElementById('aiResponse');
  const colHeaders = '<tr style="background:rgba(255,255,255,.08)"><th style="padding:.4rem .5rem;text-align:left;font-size:.7rem;color:rgba(255,255,255,.5);font-weight:500">Parameter</th><th style="padding:.4rem .5rem;text-align:left;font-size:.7rem;color:rgba(255,255,255,.5);font-weight:500">Extracted Value</th><th style="padding:.4rem .5rem;text-align:left;font-size:.7rem;color:rgba(255,255,255,.5);font-weight:500">Source</th></tr>';
  
  const ruleRows = rules.map(r => `
    <tr style="border-bottom:1px solid rgba(255,255,255,.05)">
      <td style="padding:.5rem;color:rgba(255,255,255,.9);font-size:.8rem;font-weight:500">${r.name}</td>
      <td style="padding:.5rem;font-size:.8rem;font-family:monospace;color:#35C6C4">${r.metric} ${r.operator} ${r.threshold_value ?? r.threshold_condition ?? '–'}</td>
      <td style="padding:.5rem;font-size:.75rem;color:rgba(255,255,255,.5)">${r.regulatory_reference||'AI Analysis'}</td>
    </tr>
    <tr><td colspan="3" style="padding:.25rem .5rem .75rem"><span style="background:rgba(53,198,196,.1);color:#35C6C4;font-size:.7rem;padding:.15rem .5rem;border-radius:6px">AI Confidence: ${r.ai_confidence||'~92'}%</span> <span style="color:rgba(255,255,255,.4);font-size:.75rem">${r.description||''}</span></td></tr>
  `).join('');

  resp.innerHTML = `
    <div class="ai-response fade-in">
      <div style="font-size:.78rem;color:rgba(255,255,255,.6);margin-bottom:.75rem">${data.analysis_summary||'Analysis complete.'}</div>
      <table style="width:100%;border-collapse:collapse">${colHeaders}${ruleRows}</table>
      ${rules.length ? `
      <div style="margin-top:.75rem;display:flex;gap:.5rem">
        <button class="btn btn-success btn-sm" onclick="confirmAiRules()"><i class="fas fa-check"></i> Confirm & Apply Rules</button>
        <div style="position:relative;flex:1">
          <input id="aiFollowup" class="ai-textarea" style="min-height:0;padding:.4rem .625rem;font-size:.8rem;width:100%" placeholder="Follow-up: e.g. Apply the DBR rule only for amounts above OMR 100,000…">
        </div>
        <button class="btn btn-sm" style="background:rgba(255,255,255,.15);color:white;border:none" onclick="runFollowup('${productId}')">Send</button>
      </div>` : ''}
    </div>`;
}

async function runFollowup(productId) {
  const followup = document.getElementById('aiFollowup')?.value;
  if (!followup) return;
  document.getElementById('aiPromptTA').value = followup;
  await runAiAssistant(productId);
}

function confirmAiRules() {
  toast('Rules confirmed and applied to product configuration','success');
  logAuditEntry('AI_RULE_CONFIRMED', 'rule', 'r015', 'Manual override: threshold applied only to loans >OMR 100,000');
}

function openPanel(title) {
  document.getElementById('panelTitle').textContent = title;
  document.getElementById('panelOverlay').classList.add('open');
  document.getElementById('slidePanel').classList.add('open');
}
function closePanel() {
  document.getElementById('panelOverlay').classList.remove('open');
  document.getElementById('slidePanel').classList.remove('open');
}
function showModal(title, body, onConfirm) {
  const mc = document.getElementById('modalContainer');
  mc.innerHTML = `<div class="modal-overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><h3>${title}</h3><button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-navy" id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modalConfirmBtn').onclick = onConfirm;
}
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }
function toast(msg, type='info') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle'}"></i> ${msg}`;
  c.appendChild(t);
  setTimeout(() => t.remove(), 4500);
}
