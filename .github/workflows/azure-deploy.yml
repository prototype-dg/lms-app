name: Deploy to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Verify key files exist
        run: |
          echo "--- Checking required files ---"
          ls -lh server.js dist/index.js
          ls -lh node_modules/@hono/node-server/dist/index.js
          ls -lh node_modules/better-sqlite3/build/Release/better_sqlite3.node
          echo "--- node_modules size ---"
          du -sh node_modules/

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure WEBSITE_RUN_FROM_PACKAGE is set
        run: |
          az webapp config appsettings set \
            --name app-lms-portal \
            --resource-group Dima-Gibert-RG \
            --settings WEBSITE_RUN_FROM_PACKAGE=1
          echo "✅ WEBSITE_RUN_FROM_PACKAGE=1 confirmed"

      - name: Create deployment zip (with node_modules)
        run: |
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude "*.zip" \
            --exclude ".env*" \
            --exclude "data/*" \
            --exclude ".wrangler/*" \
            --exclude "src/*" \
            --exclude "vite.config*" \
            --exclude "tsconfig*" \
            --exclude "wrangler*" \
            --exclude "ecosystem*" \
            --exclude ".deployment"
          echo "Zip size: $(du -sh deploy.zip)"
          echo "Key paths inside zip:"
          unzip -l deploy.zip | grep -E "(server\.js|dist/index\.js|node_modules/@hono|node_modules/better)" | head -10

      - name: Deploy zip to Azure (synchronous — waits for completion)
        run: |
          az webapp deploy \
            --name app-lms-portal \
            --resource-group Dima-Gibert-RG \
            --src-path deploy.zip \
            --type zip
          echo "✅ Deployment completed"

      - name: Restart app to pick up new package
        run: |
          az webapp restart \
            --name app-lms-portal \
            --resource-group Dima-Gibert-RG
          echo "✅ App restarted"

      - name: Wait for app to start (10 min, non-fatal timeout)
        run: |
          echo "Polling https://app-lms-portal.azurewebsites.net ..."
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://app-lms-portal.azurewebsites.net/ 2>/dev/null || echo "000")
            echo "$(date -u '+%H:%M:%S') Attempt $i/40: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ App is live! https://lms.andersenlab.com"
              exit 0
            fi
            sleep 15
          done
          echo "⚠️ App did not return 200 within 10 minutes — check Azure logs"
          exit 1
