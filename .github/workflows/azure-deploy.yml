name: Deploy to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create deployment zip (source + dist, no node_modules)
        # Azure will run 'npm ci --production' via Oryx build after extracting
        run: |
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude "*.zip" \
            --exclude ".env*" \
            --exclude "data/*" \
            --exclude "node_modules/*" \
            --exclude ".wrangler/*"
          echo "Zip size: $(du -sh deploy.zip)"

      - name: Enable build during deployment (Oryx runs npm ci)
        run: |
          az webapp config appsettings set \
            --name app-lms-portal \
            --resource-group Dima-Gibert-RG \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --name app-lms-portal \
            --resource-group Dima-Gibert-RG \
            --src-path deploy.zip \
            --type zip \
            --clean true \
            --async true
          echo "✅ Deployment submitted — Azure Oryx will run npm ci"

      - name: Wait for app to start
        run: |
          echo "Polling https://app-lms-portal.azurewebsites.net ..."
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://app-lms-portal.azurewebsites.net/)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ App is live at https://lms.andersenlab.com"
              exit 0
            fi
            sleep 15
          done
          echo "⚠️ App did not return 200 within 6 minutes"
          exit 1
