name: Deploy to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create deployment zip
        run: |
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude "*.zip" \
            --exclude ".env*" \
            --exclude "data/*" \
            --exclude "src/*" \
            --exclude "*.ts" \
            --exclude "vite.config*" \
            --exclude "tsconfig*" \
            --exclude "wrangler*" \
            --exclude "ecosystem*" \
            --exclude ".wrangler/*"
          echo "Zip size: $(du -sh deploy.zip)"

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --name app-lms-portal \
            --resource-group Dima-Gibert-RG \
            --src-path deploy.zip \
            --type zip \
            --clean true \
            --async true
          echo "✅ Deployment submitted"

      - name: Wait for app to start
        run: |
          echo "Polling https://app-lms-portal.azurewebsites.net ..."
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://app-lms-portal.azurewebsites.net/)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ Deployment successful! App is live at https://lms.andersenlab.com"
              exit 0
            fi
            sleep 15
          done
          echo "⚠️ App did not return 200 within 5 minutes"
          exit 1
