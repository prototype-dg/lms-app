              <div style="flex:1">
                <div style="font-weight:600;font-size:.85rem;color:var(--navy)">${n.label||n.type}</div>
                ${n.label_ar ? `<div style="font-size:.72rem;color:var(--grey-400);direction:rtl;font-family:'Noto Sans Arabic',sans-serif">${n.label_ar}</div>` : ''}

async function renderCompliance() {
  document.getElementById('pageTitle').textContent = 'Compliance';
  document.getElementById('pageSubtitle').textContent = '';

  let tags = [], allTags = [];
  try {
    const r = await fetch('/api/v1/compliance-tags');
    const d = await r.json();
    allTags = d.tags || [];
    tags = allTags;
  } catch(e) { tags = []; }

  // Build product coverage: for each tag, how many products have it mapped
  let productTagMap = {}; // tagId → Set of productIds
  await Promise.all(products.map(async p => {
    try {
      const r = await fetch(`/api/v1/compliance-tags/product/${p.id}`);
      const d = await r.json();
      (d.tags || []).forEach(t => {
        if (!productTagMap[t.id]) productTagMap[t.id] = new Set();
        productTagMap[t.id].add(p.id);
      });
    } catch{}
  }));

  // Group tags by category
  const groups = {};
  for (const tag of tags) {
    if (!groups[tag.category]) groups[tag.category] = [];
    groups[tag.category].push(tag);
  }

  const catMeta2 = {
    aml_kyc:             { icon:'fa-shield-halved',  color:'#ef4444', label:'AML / KYC' },
    consumer_protection: { icon:'fa-user-shield',    color:'#f59e0b', label:'Consumer Protection' },
    credit_risk:         { icon:'fa-chart-bar',      color:'#007F86', label:'Credit Risk' },
    esg:                 { icon:'fa-leaf',            color:'#10b981', label:'ESG / Green' },
    pdpl:                { icon:'fa-lock',            color:'#8b5cf6', label:'PDPL Data Privacy' },
    reporting:           { icon:'fa-chart-line',      color:'#3b82f6', label:'Regulatory Reporting' },
    capital:             { icon:'fa-university',      color:'#003B5C', label:'Capital Adequacy' },
    conduct:             { icon:'fa-balance-scale',   color:'#f59e0b', label:'Market Conduct' },
    general:             { icon:'fa-file-shield',     color:'#64748b', label:'General' },

  const mandatoryCount = tags.filter(t=>t.severity==='mandatory').length;
  const activeCount = tags.filter(t=>t.is_active).length;
  const coveredCount = Object.values(productTagMap).filter(s=>s.size>0).length;

  document.getElementById('pageSubtitle').textContent = `${activeCount} active tags · ${mandatoryCount} mandatory`;

  document.getElementById('mainContent').innerHTML = `<div class="page">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">
      <div><h2>Compliance Configuration</h2><p>CBO regulatory compliance tags and product coverage</p></div>

    </div>

    <!-- Regulatory Context Banner -->
    ${activeMarket ? `
    <div style="background:linear-gradient(135deg,#1e3a5f,#003B5C);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:1rem">
      <div style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="fas fa-shield-halved" style="color:#35C6C4;font-size:1.1rem"></i>
      </div>
      <div style="flex:1">
        <div style="font-weight:700;color:#fff;margin-bottom:.15rem">${activeMarket.regulator_name} Compliance Framework — ${activeMarket.name}</div>
        <div style="font-size:.78rem;color:rgba(255,255,255,.55)">AML/CFT · PDPL Data Privacy · ESG Disclosure · CBO Capital Adequacy · Market Conduct Rules</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:1.5rem;font-weight:700;color:#35C6C4">${Math.round((coveredCount/Math.max(tags.length,1))*100)}%</div>
        <div style="font-size:.7rem;color:rgba(255,255,255,.5)">Coverage</div>
      </div>

    <!-- Stats -->

      <div class="metric-card"><div class="metric-value">${activeCount}</div><div class="metric-label">Active</div></div>

      return `

        <div class="card-header">
          <h4><i class="fas ${meta.icon}" style="color:${meta.color};margin-right:.5rem"></i>${meta.label} <span style="font-size:.75rem;font-weight:400;color:var(--grey-400)">(${catTags.length} tags)</span></h4>

          </div>

            return `

              </div>
              <code style="font-size:.7rem;color:var(--teal)">${tag.code||tag.id}</code>
              <span class="badge ${tag.severity==='mandatory'?'badge-red':'badge-amber'}" style="font-size:.67rem">${tag.severity}</span>
              <span style="font-size:.72rem;color:var(--grey-500)">${tag.regulatory_reference||'—'}</span>
              <div>
                ${coverage > 0

                  : `<span style="font-size:.75rem;color:var(--grey-400)">None</span>`}

    <!-- Product Compliance Coverage Matrix -->
    <div class="card" style="margin-bottom:1.25rem">

        <h4><i class="fas fa-table"></i> Product Compliance Coverage</h4>
        <span style="font-size:.75rem;color:var(--grey-400)">Mandatory tags per product</span>
      </div>
      <div class="card-body" style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:.75rem;min-width:600px">
          <thead>
            <tr style="background:var(--grey-50)">
              <th style="padding:.5rem .75rem;text-align:left;font-weight:600;color:var(--grey-600);border-bottom:2px solid var(--grey-200)">Product</th>
              ${tags.filter(t=>t.severity==='mandatory').map(t=>`<th style="padding:.5rem .4rem;text-align:center;font-weight:600;color:var(--grey-600);border-bottom:2px solid var(--grey-200);writing-mode:vertical-lr;min-width:28px;max-width:40px" title="${t.name}">${t.code||t.id.slice(-4)}</th>`).join('')}
              <th style="padding:.5rem .75rem;text-align:center;font-weight:600;color:var(--grey-600);border-bottom:2px solid var(--grey-200)">Score</th>
            </tr>
          </thead>
          <tbody>
            ${products.map(p => {
              const mandatoryTags = tags.filter(t=>t.severity==='mandatory');
              const covered = mandatoryTags.filter(t => productTagMap[t.id]?.has(p.id)).length;
              const pct = mandatoryTags.length > 0 ? Math.round((covered/mandatoryTags.length)*100) : 100;

                <td style="padding:.5rem .75rem;font-weight:500;color:var(--navy)">${p.name}</td>

                <td style="padding:.4rem .75rem;text-align:center">

    </div>
  </div>`;

let _rulesFilterProduct = null; // null = global CBO rules only
async function renderRules(filterProductId) {
  if (filterProductId !== undefined) _rulesFilterProduct = filterProductId;
  const showingProduct = _rulesFilterProduct;

  document.getElementById('pageTitle').textContent = 'Rules Engine';

  // Fetch global rules + product-specific rules
  let globalRules = [], productRules = [];
  try {
    const gr = await fetch('/api/v1/rules');
    const gd = await gr.json();
    globalRules = (gd.rules || []).filter(r => !r.product_id);
  } catch(e) { globalRules = []; }

  if (showingProduct) {
    try {
      const pr = await fetch(`/api/v1/rules?product_id=${showingProduct}`);
      const pd = await pr.json();
      productRules = (pd.rules || []).filter(r => r.product_id === showingProduct);
    } catch(e) { productRules = []; }
  }

  rules = [...globalRules, ...productRules];
  const activeCount = rules.filter(r => r.is_active).length;
  const productLabel = showingProduct ? (products.find(p=>p.id===showingProduct)?.name || showingProduct) : null;
  document.getElementById('pageSubtitle').textContent = showingProduct
    ? `${globalRules.filter(r=>r.is_active).length} CBO global + ${productRules.filter(r=>r.is_active).length} product-specific rules`
    : `${activeCount} CBO global regulatory rules`;

  const catColors = { creditworthiness:'rule-cat-creditworthiness', collateral:'rule-cat-collateral', esg:'rule-cat-esg', compliance:'rule-cat-compliance', stress_test:'rule-cat-stress_test', product:'rule-cat-product', eligibility:'rule-cat-eligibility' };

  function ruleRows(ruleList, showOrigin) {
    if (!ruleList.length) return '<p style="color:var(--grey-400);font-size:.83rem;padding:.75rem;font-style:italic">No rules in this section.</p>';
    return ruleList.map(r => `
    <div style="display:grid;grid-template-columns:2.5fr 1.1fr 1.6fr 2fr .9fr;padding:.625rem .75rem;font-size:.82rem;border-bottom:1px solid var(--grey-100);align-items:center" class="${r.source==='ai_generated'?'ai-row':''}">
      <div>
        <span style="font-weight:500;color:var(--navy)">${r.name}</span>
        ${showOrigin && r.product_id ? `<span style="margin-left:.4rem;font-size:.67rem;padding:.1rem .4rem;border-radius:4px;background:rgba(0,127,134,.1);color:var(--teal);font-weight:600">PRODUCT</span>` : ''}
        ${r.source==='ai_generated'?'<span class="ai-confidence-tag"><i class="fas fa-robot"></i> AI ${r.ai_confidence||94}%</span>':''}
      </div>
      <span class="rule-category-tag ${catColors[r.category]||''}">${r.category}</span>
      <code style="font-size:.75rem;color:var(--teal)">${r.metric} ${r.operator} ${r.threshold_value??r.threshold_condition??'–'}</code>
      <span style="font-size:.75rem;color:var(--grey-500)">${r.regulatory_reference||'–'}</span>
      <span class="badge ${r.severity==='hard'?'badge-red':'badge-amber'}">${r.severity||'hard'}</span>
    </div>`).join('');
  }

  const productSelector = `<select class="form-control" style="width:220px;font-size:.82rem;padding:.3rem .6rem" onchange="renderRules(this.value||null)">
    <option value="">CBO Global Rules only</option>
    ${products.map(p=>`<option value="${p.id}" ${p.id===showingProduct?'selected':''}>${p.name}</option>`).join('')}
  </select>`;

  document.getElementById('mainContent').innerHTML = `<div class="page">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">
      <div>
        <h2>Rules Engine</h2>
        <p>CBO-compliant regulatory rules library${productLabel ? ` · filtered for <strong>${productLabel}</strong>` : ''}</p>
      </div>
      <div style="display:flex;gap:.5rem;align-items:center">
        ${productSelector}
        <button class="btn btn-navy" onclick="toast('Open AI Assistant to generate new rules from regulatory text','info')"><i class="fas fa-robot"></i> Generate from Regulatory Text</button>
      </div>
    </div>

    <!-- Stats bar -->
    <div class="metric-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:1.5rem">
      <div class="metric-card"><div class="metric-value">${globalRules.filter(r=>r.is_active).length}</div><div class="metric-label">CBO Global Rules</div></div>
      <div class="metric-card"><div class="metric-value">${showingProduct ? productRules.filter(r=>r.is_active).length : '—'}</div><div class="metric-label">Product-Specific Rules</div></div>
      <div class="metric-card"><div class="metric-value">${globalRules.filter(r=>r.severity==='hard').length}</div><div class="metric-label">Hard Constraints</div></div>

function filterRulesTable(q, tableId) {
  const lq = q.toLowerCase();
  const table = document.getElementById(tableId);
  if (!table) return;
  table.querySelectorAll('div[style*="grid-template-columns"]').forEach((row, i) => {
    if (i === 0) return; // skip header
    row.style.display = (row.textContent.toLowerCase().includes(lq)) ? '' : 'none';
  });
}

function renderCompliancePanel(fullD) {
  // fullD is the product-enriched payload from /compliance/full/:appId
  const app    = fullD.application  || {};
  const prod   = fullD.product      || {};
  const esg    = fullD.esg_status   || {};
  const credit = fullD.credit_metrics || {};
  const esgRules = (fullD.rules?.esg        || []);
  const allRules = (fullD.rules?.all_evaluated || []);
  const rec    = esg.ai_recommendation || {};

  // Store fullD on window so generateReport can access it
  window._lastComplianceData = fullD;

  const ragIcon     = { green:'🟢', amber:'🟡', red:'🔴' };
  const statusLabel = { auto_verified:'Auto-Verified', manual_review:'Review Required', approved:'Approved', rejected:'Rejected', pending:'Pending' };

  const dbr        = credit.dbr?.value;
  const ltv        = credit.ltv?.value;
  const malaa      = credit.malaa_score?.value;
  const stressRate = credit.stress_test?.rate;
  const stressDbr  = credit.stress_test?.stress_dbr;
  const stressPast = credit.stress_test?.passed !== false;
  const mp         = credit.monthly_payment;
  const pv         = credit.property_value;

  const fmtPct = v => v !== null && v !== undefined ? `${Number(v).toFixed(1)}%` : '—';
  const fmtVal = v => v !== null && v !== undefined ? v : '—';

  const stdRate = 5.5;
  const discount = app.applied_rate ? (stdRate - app.applied_rate).toFixed(2) : '0.75';

  // ESG documents — traversed chain: application → unit → project
  const epcDoc      = fullD.documents?.epc  || null;
  const gsasDoc2    = fullD.documents?.gsas || null;
  const eiaDoc2     = fullD.documents?.eia  || null;
  const epcFileUrl  = esg.epc?.file_url  || null;
  const epcFilename = esg.epc?.filename  || (epcDoc?.filename) || 'EPC_Report.pdf';
  const epcSource   = esg.epc?.doc_source; // 'application' | 'unit' | 'project' | null

  // Helper: build a compact document card for compliance review

    const filename   = docRow?.filename  || `${label.replace(/\s/g,'_')}.pdf`;
    const fileUrl    = docRow?.file_url  || null;
    const confidence = esgObj?.confidence || docRow?.ai_confidence || 0;
    const status     = esgObj?.status || docRow?.validation_status || 'pending';
    const statusMap  = { auto_verified:'Auto-Verified ✅', manual_review:'Manual Review ⚠️', approved:'Approved ✅', rejected:'Rejected ❌', pending:'Pending ⏳', flagged:'Flagged ⚠️' };
    const statusStr  = statusMap[status] || status;
    const confColor  = confidence >= 90 ? 'var(--success)' : confidence >= 70 ? 'var(--amber)' : 'var(--danger)';
    const srcBadge   = sourceLabel
      ? `<span style="font-size:.65rem;background:rgba(0,127,134,.1);color:var(--teal);padding:.1rem .4rem;border-radius:10px;white-space:nowrap">📁 ${sourceLabel}</span>`

    return `<div style="border:1px solid var(--grey-200);border-radius:var(--radius-md);padding:.75rem;background:${docRow?'white':'var(--grey-50)'}">

          <div style="display:flex;align-items:center;gap:.4rem;margin-top:.15rem;flex-wrap:wrap">
            ${srcBadge}
            <span style="font-size:.65rem;color:${confColor};font-weight:600">${confidence}% confidence</span>

        </div>

      <div class="confidence-bar" style="margin-bottom:.5rem"><div class="confidence-bar-fill ${confidence>=80?'confidence-high':'confidence-med'}" style="width:${confidence}%"></div></div>
      ${fileUrl
        ? `<a href="${fileUrl}" target="_blank" download="${filename}"
             style="display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;background:var(--danger);color:white;padding:.3rem .65rem;border-radius:var(--radius-sm);text-decoration:none;font-weight:600">

          ['GSAS Premium', `${gsasPremium}`]

      </div>

            <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--grey-200)">
              <div class="avatar avatar-lg">${(app.customer_name||'SA').split(' ').map(w=>w[0]).join('').substring(0,2)}</div>
              <div>
                <div style="font-weight:700;font-size:.95rem;color:var(--navy)">${app.customer_name||'–'}</div>
                <div style="color:var(--grey-500)">OMR ${(app.loan_amount||0).toLocaleString()} · ${app.loan_term||25} yrs · ${prod.name||'—'}</div>
              </div>
            </div>
            ${[
              ['Application Ref', `<span style="font-family:monospace;color:var(--teal)">${app.reference||'–'}</span>`],
              ['Unit / Project',  app.unit_number ? `${app.unit_number}${app.project_name?' — '+app.project_name:''}` : (app.property_address||'—')],

async function overrideDocConfidence(docId) {
  await fetch(`/api/v1/documents/${docId}/override`, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ user_id:'u002', user_name:'Aisha Al-Balushi', reason:'Visual verification completed. Document legible. Rating and expiry confirmed.', regulatory_reference:'OEESC Section 5.1' })
  });
  toast('Manual override recorded – EPC accepted','success');
}

async function approveEsg(appId) {
  await fetch(`/api/v1/compliance/${appId}/approve-esg`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ user_id:'u002', user_name:'Aisha Al-Balushi', notes:'ESG documents verified. EPC manually confirmed.' })
  });
  toast('ESG Compliance Approved. Awaiting Credit Risk approval.','success');
  closePanel();
  await renderComplianceTasks();
}

async function rejectApplication(appId) {
  if (!confirm('Reject this application?')) return;
  await fetch(`/api/v1/compliance/${appId}/reject`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ user_id:'u002', reason:'ESG requirements not met' })
  });
  toast('Application rejected','error');
  closePanel();
  await renderComplianceTasks();
}

/* ======================== CREDIT REVIEW (Risk Officer) ======================== */
async function renderCreditReview() {
  document.getElementById('pageTitle').textContent = 'Credit Risk Review';
  document.getElementById('pageSubtitle').textContent = 'Credit risk assessment & stress testing';
  let applications = [];
  try {
    const r = await fetch('/api/v1/compliance/queue');
    const d = await r.json();
    applications = d.applications || [];
  } catch(e) { applications = []; }

  const cols = {
    pending:     applications.filter(a => ['submitted','credit_scoring','esg_review'].includes(a.status)),
    in_progress: applications.filter(a => a.status==='credit_review'),
    approved:    applications.filter(a => a.status==='approved'),
    rejected:    applications.filter(a => a.status==='rejected')
  };
  const colLabels = { pending:'Pending Risk Review', in_progress:'Under Assessment', approved:'Risk Cleared', rejected:'Risk Declined' };
  const colColors = { pending:'var(--amber)', in_progress:'var(--teal)', approved:'var(--success)', rejected:'var(--danger)' };

  document.getElementById('mainContent').innerHTML = `<div class="page">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">
      <div><h2>Credit Risk Review</h2><p>Credit assessment, stress testing & portfolio concentration</p></div>
      <span class="badge badge-amber" style="font-size:.8rem;padding:.4rem .9rem">
        <i class="fas fa-exclamation-triangle"></i> ${cols.pending.length} Awaiting Risk Sign-off
      </span>
    </div>
    <div class="kanban">
      ${Object.entries(cols).map(([key, apps]) => `
      <div class="kanban-col">
        <div class="kanban-col-header" style="color:${colColors[key]}">
          ${colLabels[key]} <span class="kanban-count">${apps.length}</span>
        </div>
        ${apps.map(a => `
        <div class="kanban-card ${a.priority==='high'?'priority':''}" onclick="openRiskDetail('${a.id}')">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.5rem">
            <span style="font-family:monospace;font-size:.75rem;color:var(--teal);font-weight:600">${a.reference}</span>
            ${a.priority==='high'?'<span class="badge badge-amber" style="font-size:.65rem">HIGH RISK</span>':''}
          </div>
          <div style="font-weight:600;font-size:.85rem;color:var(--navy);margin-bottom:.25rem">${a.customer_name||''}</div>
          <div style="font-size:.78rem;color:var(--grey-500);margin-bottom:.5rem">${a.product_name||''}</div>
          <div style="display:flex;justify-content:space-between;font-size:.78rem">
            <span>OMR ${(a.loan_amount||0).toLocaleString()}</span>
            ${a.gsas_score?`<span style="color:var(--success)"><i class="fas fa-leaf"></i> GSAS ${a.gsas_score}</span>`:''}
          </div>
        </div>`).join('')}
      </div>`).join('')}
    </div>
  </div>`;
}

async function openRiskDetail(appId) {
  openPanel('Loading credit risk assessment…');
  try {
    const fullR = await fetch(`/api/v1/compliance/full/${appId}`);
    const fullD = await fullR.json();
    if (fullD.error) throw new Error(fullD.error);
    renderRiskPanel(fullD);
  } catch(e) { document.getElementById('panelBody').innerHTML = '<p style="padding:1rem;color:var(--danger)">Error loading risk assessment.</p>'; }
}

function renderRiskPanel(fullD) {
  // fullD is the product-enriched payload from /compliance/full/:appId
  const app          = fullD.application      || {};
  const prod         = fullD.product          || {};
  const credit       = fullD.credit_metrics   || {};
  const esg          = fullD.esg_status       || {};
  const creditRules  = (fullD.rules?.credit   || []);
  const collRules    = (fullD.rules?.collateral|| []);
  const allRules     = (fullD.rules?.all_evaluated || []);

  // Store fullD on window so generateReport can access it
  window._lastComplianceData = fullD;

  const salary     = app.salary_omr || 0;
  const loanAmt    = app.loan_amount || 0;
  const loanTerm   = app.loan_term || 25;
  const rate       = app.applied_rate || 5.5;
  const propVal    = credit.property_value || (loanAmt / 0.8);
  const mp         = credit.monthly_payment || 0;
  const dbr        = credit.dbr?.value;
  const ltv        = credit.ltv?.value;
  const malaa      = credit.malaa_score?.value;
  const stressRate = credit.stress_test?.rate || (rate + 3.5);
  const stressDbr  = credit.stress_test?.stress_dbr;
  const stressPast = credit.stress_test?.passed !== false;

  const maxDbr   = prod.green_dbr || prod.max_dbr || 55;
  const maxLtv   = prod.max_ltv || 90;

  const fmtPct = v => (v !== null && v !== undefined) ? `${Number(v).toFixed(1)}%` : '—';
  const fmtOMR = v => v ? `OMR ${Number(v).toLocaleString(undefined,{maximumFractionDigits:0})}` : '—';

  const disposable = salary > 0 && mp > 0 ? salary - mp : null;
  const capacityRatio = salary > 0 && mp > 0 ? ((salary - mp) / salary * 100) : null;
  const collateralCoverage = propVal && loanAmt ? (propVal / loanAmt * 100) : null;
  const largeExposure = loanAmt > 500000;
  const sectorConc = `Real Estate — Residential Green (${app.project_name||'—'})`;

  // Risk rating: uses product-specific thresholds
  const riskScore =
    (dbr  !== null ? (dbr  <= 30 ? 0 : dbr  <= maxDbr*0.7 ? 1 : dbr  <= maxDbr ? 2 : 3) : 1) +
    (ltv  !== null ? (ltv  <= 60 ? 0 : ltv  <= 75 ? 1 : ltv  <= maxLtv ? 2 : 3) : 1) +
    (malaa !== null ? (malaa >= 800 ? 0 : malaa >= 700 ? 1 : malaa >= 650 ? 2 : 3) : 1) +
    (stressPast ? 0 : 2);
  const riskTier = riskScore <= 1 ? {label:'Low Risk',      color:'var(--success)', icon:'fa-shield-check'}  :
                   riskScore <= 3 ? {label:'Moderate Risk',  color:'var(--amber)',   icon:'fa-shield'}        :
                                    {label:'High Risk',       color:'var(--danger)',  icon:'fa-shield-exclamation'};

  // Build credit + collateral rule checklist
  const ruleRows = ([...creditRules, ...collRules]).map(r => {
    const ev = allRules.find(ar => ar.id === r.id)?.evaluation || { status:'unknown', value:null };
    const pass = ev.status === 'pass';
    const unknown = ev.status === 'unknown';
    const icon = unknown ? '⚪' : pass ? '✅' : '❌';
    const badge = unknown ? 'amber' : pass ? 'success' : 'danger';
    const valStr = ev.value !== null && ev.value !== undefined ? ` (${ev.value})` : '';
    return `<tr>
      <td style="padding:.4rem .6rem;font-size:.78rem;font-weight:500;color:var(--navy)">${r.name}</td>
      <td style="padding:.4rem .6rem;font-size:.75rem;color:var(--grey-500)">${r.description||'—'}</td>
      <td style="padding:.4rem .6rem;font-size:.75rem;text-align:center">${icon} <span style="font-size:.7rem;color:var(--${badge})">${ev.status==='unknown'?'N/A':ev.status.toUpperCase()}${valStr}</span></td>
      <td style="padding:.4rem .6rem;font-size:.72rem;color:var(--grey-400)">${r.regulatory_reference||'—'}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="4" style="padding:.75rem;color:var(--grey-400);font-size:.8rem;text-align:center">No credit/collateral rules defined for this product</td></tr>`;

  document.getElementById('panelBody').innerHTML = `
    <!-- Product context banner -->
    <div style="background:linear-gradient(135deg,#0a1628,#1a3a5c);border-radius:var(--radius-lg);padding:.85rem 1.1rem;color:white;margin-bottom:1.25rem;display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap">
      <div style="flex:1;min-width:180px">
        <div style="font-size:.68rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.2rem">Credit Risk Review — Product</div>
        <div style="font-size:1rem;font-weight:700;color:#a8edde">${prod.name || app.product_name || '—'}</div>
      </div>
      <div style="display:flex;gap:1.5rem;flex-wrap:wrap">
        ${[
          ['Max DBR', `${maxDbr}%`],
          ['Max LTV', `${maxLtv}%`],
          ['Base Rate', `${prod.base_rate||'—'}%`],
          ['Risk Score', `${riskScore}/8`]
        ].map(([l,v])=>`<div style="text-align:center"><div style="font-size:.68rem;color:rgba(255,255,255,.45)">${l}</div><div style="font-size:.88rem;font-weight:700;color:${l==='Risk Score'?riskTier.color:'white'}">${v}</div></div>`).join('')}
      </div>

async function approveRisk(appId) {
  await fetch(`/api/v1/compliance/${appId}/approve-risk`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ user_id:'u003', user_name:'Omar Al-Mantheri', notes:'Credit risk assessment complete. Stress test passed. Collateral adequate. Recommend approval.' })
  });
  toast('Credit Risk Approved. Application status updated to Approved.','success');
  closePanel();
  await renderCreditReview();
}

/* ======================== AUDIT LOGS ======================== */
async function renderAuditLogs(filterAction='', filterEntity='') {
  document.getElementById('pageTitle').textContent = 'Audit Trail';
  document.getElementById('pageSubtitle').textContent = 'Immutable compliance log';

  // Build query string with active filters
  let qs = '/api/v1/audit?limit=100';
  if (filterAction) qs += `&action=${encodeURIComponent(filterAction)}`;
  if (filterEntity) qs += `&entity_type=${encodeURIComponent(filterEntity)}`;

  let totalCount = 0;
  try {
    const r = await fetch(qs);
    const d = await r.json();
    auditLogs = d.audit_logs || [];
    totalCount = d.total || auditLogs.length;
  } catch(e) { auditLogs = []; }

  const actionIcon = {
    PRODUCT_CLONED:'fa-copy', PRODUCT_CONFIG_UPDATED:'fa-pen', PRODUCT_VERSION_SNAPSHOT:'fa-camera',
    AI_RULE_GENERATED:'fa-robot', AI_RULE_CONFIRMED:'fa-check-double', AI_SCHEMA_GENERATED:'fa-code',
    PRODUCT_PUBLISHED:'fa-rocket', PROJECT_CREATED:'fa-plus',
    DOCUMENT_AUTO_VERIFIED:'fa-shield-check', DOCUMENT_FLAGGED_REVIEW:'fa-flag', DOCUMENT_OVERRIDE:'fa-user-check',
    APPLICATION_SUBMITTED:'fa-paper-plane', APPLICATION_APPROVED:'fa-check-circle',
    CREDIT_SCORING_COMPLETE:'fa-chart-bar', CREDIT_REVIEW_APPROVED:'fa-thumbs-up',
    ESG_COMPLIANCE_APPROVED:'fa-leaf', ESCROW_TRANCHE_RELEASED:'fa-money-bill-transfer',
    RULE_UPDATED:'fa-sliders', MANUAL_ENTRY:'fa-pencil'
  };
  const sourceColor  = { ai_generated:'ai', ai:'ai', manual:'manual', system:'system' };
  const entityColors = { application:'var(--teal)', product:'var(--amber)', rule:'var(--blue)', project:'var(--green)' };

  // Unique action/entity values for filter dropdowns
  const allActions  = [...new Set(auditLogs.map((l) => l.action))].sort();
  const allEntities = [...new Set(auditLogs.map((l) => l.entity_type).filter(Boolean))].sort();

  const buildTimeline = () => {
    if (!auditLogs.length) return `
      <div style="text-align:center;padding:3rem 1rem;color:var(--grey-400)">
        <i class="fas fa-clipboard-list" style="font-size:2.5rem;margin-bottom:1rem;display:block;opacity:.4"></i>
        <p style="font-size:.95rem;font-weight:500">No audit entries found</p>
        <p style="font-size:.82rem;margin-top:.3rem">${filterAction||filterEntity ? 'Try clearing the filters above.' : 'Actions will appear here as users work with applications, products and rules.'}</p>
      </div>`;

    return auditLogs.map((log) => {
      const icon    = actionIcon[log.action] || 'fa-circle';
      const cls     = sourceColor[log.source] || 'manual';
      const details = (() => { try { return JSON.parse(log.details||'{}'); } catch{ return {}; } })();
      const detailKeys = Object.keys(details);
      const entityCol = entityColors[log.entity_type] || 'var(--grey-500)';
      const entityLabel = log.entity_label
        ? `<a href="#" onclick="event.preventDefault();if(log.entity_type==='application')openApplicationDetail('${log.entity_id}')" style="color:${entityCol};font-weight:500">${log.entity_label}</a>`
        : '';
      const actionLabel = log.action.replace(/_/g,' ').toLowerCase().replace(/\b\w/g,(c)=>c.toUpperCase());

      return `
      <div class="audit-item">
        <div class="audit-dot ${cls}"><i class="fas ${icon}" style="font-size:.75rem"></i></div>
        <div class="audit-content">
          <div class="audit-action">
            ${actionLabel}
            ${log.ai_confidence ? `<span class="ai-confidence-tag"><i class="fas fa-robot"></i> ${log.ai_confidence}%</span>` : ''}
            ${log.source==='ai'||log.source==='ai_generated' ? '<span style="background:rgba(100,180,220,.15);color:var(--teal);font-size:.7rem;padding:.1rem .45rem;border-radius:999px;margin-left:.35rem">AI</span>' : ''}
          </div>
          <div class="audit-meta">
            <span style="font-weight:500">${log.user_name||'System'}</span>
            ${log.user_role ? `· <span style="color:var(--grey-500)">${log.user_role.replace(/_/g,' ')}</span>` : ''}
            ${log.entity_type ? `· <span style="color:${entityCol};font-size:.72rem;background:${entityCol}1a;padding:.05rem .4rem;border-radius:4px">${log.entity_type}</span>` : ''}
            ${entityLabel}
            · <span style="color:var(--grey-400)">${new Date(log.created_at).toLocaleString()}</span>
          </div>
          ${log.regulatory_reference ? `<div style="font-size:.72rem;color:var(--teal);margin-top:.25rem"><i class="fas fa-gavel"></i> ${log.regulatory_reference}</div>` : ''}
          ${detailKeys.length ? `<div class="audit-detail" style="margin-top:.3rem;font-size:.74rem">${detailKeys.slice(0,4).map(k=>`<span style="margin-right:.75rem"><strong>${k}:</strong> ${JSON.stringify(details[k]).substring(0,60)}</span>`).join('')}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  };

  document.getElementById('mainContent').innerHTML = `<div class="page">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">
      <div>
        <h2>Audit Trail</h2>
        <p>Immutable log of all actions, AI recommendations, and manual overrides · <strong>${totalCount}</strong> total entries</p>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="toast('Audit report exported','success')"><i class="fas fa-download"></i> Export</button>
    </div>

    <!-- Filter bar -->
    <div class="card" style="margin-bottom:1rem">
      <div class="card-body" style="padding:.75rem 1rem">
        <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:.4rem;font-size:.82rem;color:var(--grey-500)">
            <i class="fas fa-filter"></i> Filter:
          </div>
          <select id="auditFilterAction" onchange="renderAuditLogs(this.value, document.getElementById('auditFilterEntity').value)"
            style="font-size:.82rem;padding:.3rem .6rem;border:1px solid var(--grey-200);border-radius:var(--radius-sm);background:white;color:var(--grey-700);cursor:pointer">
            <option value="">All actions</option>
            ${allActions.map((a)=>`<option value="${a}" ${a===filterAction?'selected':''}>${a.replace(/_/g,' ')}</option>`).join('')}
          </select>
          <select id="auditFilterEntity" onchange="renderAuditLogs(document.getElementById('auditFilterAction').value, this.value)"
            style="font-size:.82rem;padding:.3rem .6rem;border:1px solid var(--grey-200);border-radius:var(--radius-sm);background:white;color:var(--grey-700);cursor:pointer">
            <option value="">All entity types</option>
            ${allEntities.map((e)=>`<option value="${e}" ${e===filterEntity?'selected':''}>${e}</option>`).join('')}
          </select>
          ${filterAction||filterEntity ? `<button class="btn btn-ghost btn-sm" onclick="renderAuditLogs()" style="font-size:.78rem"><i class="fas fa-times"></i> Clear</button>` : ''}
          <span style="margin-left:auto;font-size:.8rem;color:var(--grey-400)">Showing ${auditLogs.length} of ${totalCount}</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="audit-timeline">
          ${buildTimeline()}
        </div>
      </div>
    </div>
  </div>`;
}

/* ======================== REPORTS ======================== */
async function renderReports() {
  document.getElementById('pageTitle').textContent = 'Regulatory Reports';
  document.getElementById('pageSubtitle').textContent = 'Portfolio overview & CBO compliance reports';

  // Fetch all data upfront — renderPage already shows a spinner while we await
  let summary = null;
  try {
    const r = await fetch('/api/v1/compliance/summary');
    if (r.ok) summary = await r.json();
  } catch(e) { summary = null; }

  const s = summary || {};
  const apps       = s.applications     || [];
  const statusCts  = s.status_counts    || {};
  const prodCts    = s.product_counts   || [];
  const esg        = s.esg_stats        || {};
  const dbrSt      = s.dbr_stats        || {};
  const avgs       = s.averages         || {};
  const recentAud  = s.recent_audit     || [];
  const total      = s.total_applications || 0;
  const volume     = s.total_loan_volume  || 0;

  // ── helpers ────────────────────────────────────────────────────────────────
  const fmtOMR  = (v) => v >= 1000000 ? `OMR ${(v/1000000).toFixed(2)}M` : v >= 1000 ? `OMR ${(v/1000).toFixed(0)}K` : `OMR ${v}`;
  const fmtPct  = (v)   => v != null ? `${v}%` : '—';
  const statusBadge = (st) => {
    const map = { approved:'green', submitted:'amber', credit_review:'amber', risk_review:'amber', rejected:'red', pending:'grey' };
    const col = map[st] || 'grey';
    return `<span class="badge badge-${col}">${st.replace(/_/g,' ')}</span>`;
  };
  const epcBadge = (r) => {
    if (!r) return '<span style="color:var(--grey-300)">—</span>';
    const col = r<='B' ? 'green' : r<='D' ? 'amber' : 'red';
    return `<span class="badge badge-${col}">${r}</span>`;
  };

  // ── build smart prompt from real stats ────────────────────────────────────
  const approvedCount  = statusCts['approved']      || 0;

async function generateReport(appRef) {
  // Support both: inline panel textarea (compliance detail) and regulatory reports page textarea
  const prompt = document.getElementById('reportPromptPanel')?.value
    || document.getElementById('reportPrompt')?.value
    || `Generate compliance report for ${appRef||'Green Home Loan applications'}`;
  // Output target: panel inline div (when called from compliance/risk detail) or reports page div
  const output = document.getElementById('reportOutput');
  if (!output) { toast('Report output area not found', 'error'); return; }
  output.innerHTML = '<div style="padding:.75rem;text-align:center;color:var(--grey-500)"><i class="fas fa-spinner fa-spin"></i> Generating report…</div>';

  // Build rich context from the cached /compliance/full/ payload
  const fullCtx = window._lastComplianceData || null;
  const contextPayload = fullCtx ? {
    app_ref:      appRef,
    product_name: fullCtx.product?.name,
    product_id:   fullCtx.product?.id,
    application:  { id: fullCtx.application?.id, reference: fullCtx.application?.reference,
                    customer_name: fullCtx.application?.customer_name, loan_amount: fullCtx.application?.loan_amount,
                    loan_term: fullCtx.application?.loan_term, applied_rate: fullCtx.application?.applied_rate,
                    gsas_score: fullCtx.application?.gsas_score, epc_rating: fullCtx.application?.epc_rating,
                    salary_omr: fullCtx.application?.salary_omr, status: fullCtx.application?.status },
    product:      fullCtx.product,
    credit_metrics: fullCtx.credit_metrics,
    esg_status:   fullCtx.esg_status,
    rules_summary: (fullCtx.rules?.all_evaluated||[]).map(r=>({ name:r.name, category:r.category, status:r.evaluation?.status, value:r.evaluation?.value }))
  } : { app_ref: appRef };

  try {
    const r = await fetch('/api/v1/ai/reports/generate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ prompt, app_ref: appRef, context: contextPayload })
    });
    if (!r.ok) throw new Error('API error');
    const d = await r.json();
    renderReport(d, output);
  } catch(e) {
    // Graceful fallback: render a demo report from available data
    output.innerHTML = `<div class="card fade-in" style="margin-top:.5rem">
      <div class="card-header" style="background:var(--navy);color:white">
        <h4 style="color:white"><i class="fas fa-file-chart-pie"></i> Compliance Report${appRef?' — '+appRef:''}</h4>
        <div style="display:flex;gap:.5rem">
          <button class="btn btn-sm" style="background:rgba(255,255,255,.15);color:white;border:none" onclick="toast('PDF exported','success')"><i class="fas fa-file-pdf"></i> Export PDF</button>
        </div>
      </div>
      <div class="card-body" style="font-size:.82rem">
        <p style="color:var(--grey-600);margin-bottom:.75rem"><i class="fas fa-info-circle"></i> AI report service offline — displaying summary from application data.</p>
        <div style="background:var(--grey-50);border-radius:var(--radius-md);padding:.75rem;margin-bottom:.75rem">
          <strong>Prompt used:</strong> <em style="color:var(--grey-600)">${prompt}</em>
        </div>
        <p>Application <strong>${appRef||'submitted'}</strong> has been reviewed for ESG compliance. 
        GSAS certification and EPC documents are on file. Credit metrics (DBR, LTV, MALA'A score) 
        have been assessed against CBO green financing thresholds. 
        Stress test at +350bps conducted. Application forwarded to credit risk officer for final sign-off.</p>
        <div style="margin-top:.75rem;color:var(--grey-400);font-size:.75rem">Generated: ${new Date().toLocaleString()}</div>
      </div>
    </div>`;
  }
}

async function renderEscrow() {
  document.getElementById('pageTitle').textContent = 'Escrow & Disbursement';

    const appRef = localStorage.getItem('bo_active_app_ref') || '';

          <span class="badge badge-active">${app.status || 'Active'}</span>

async function saveProductChanges(id) {
  const get = (eid) => { const el = document.getElementById(eid); return el ? el.value : null; };
  const payload = { user_id: 'u001', user_name: 'Fatima Al-Rashdi' };
  const fields = {
    name: get('pName'), description: get('pDesc'),
    min_term: get('pMinTerm') ? parseInt(get('pMinTerm')) : null,
    max_term: get('pMaxTerm') ? parseInt(get('pMaxTerm')) : null,
    min_amount: get('pMinAmount') ? parseInt(get('pMinAmount')) : null,
    max_amount: get('pMaxAmount') ? parseInt(get('pMaxAmount')) : null,
    base_rate: get('pRate') ? parseFloat(get('pRate')) : null,
    max_dbr: get('pMaxDbr') ? parseFloat(get('pMaxDbr')) : null,
    max_ltv: get('pMaxLtv') ? parseFloat(get('pMaxLtv')) : null,
    green_dbr: get('pGreenDbr') ? parseFloat(get('pGreenDbr')) : null,
    gsas_min_score: get('pGsasMin') ? parseInt(get('pGsasMin')) : null,
    gsas_premium_score: get('pGsasPremium') ? parseInt(get('pGsasPremium')) : null,
    green_discount_standard: get('pGreenDiscStd') ? parseFloat(get('pGreenDiscStd')) : null,
    green_discount_premium: get('pGreenDiscPrem') ? parseFloat(get('pGreenDiscPrem')) : null,
  };
  // Only include non-null changed fields
  for (const [k,v] of Object.entries(fields)) { if (v !== null && v !== '') payload[k] = v; }
  try {
    const r = await fetch(`/api/v1/products/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const d = await r.json();
    if (d.success) {
      toast('Changes saved successfully', 'success');
      await loadProducts();
      await openProductDetail(id);
    } else { toast(d.error||'Save failed', 'error'); }
  } catch(e) { toast('Save failed: ' + e.message, 'error'); }
}

/* ======================== PANEL / MODAL HELPERS ======================== */
function openPanel(title, opts={}) {
  document.getElementById('panelTitle').textContent = title;
  document.getElementById('panelOverlay').classList.add('open');
  const sp = document.getElementById('slidePanel');
  if (opts.narrow) sp.classList.add('narrow'); else sp.classList.remove('narrow');
  sp.classList.add('open');
}
function closePanel() {
  document.getElementById('panelOverlay').classList.remove('open');
  const sp = document.getElementById('slidePanel');
  sp.classList.remove('open');
  sp.classList.remove('narrow');
}
function showModal(title, body, onConfirm, opts={}) {
  const confirmLabel = opts.confirmLabel || 'Confirm';
  const mc = document.getElementById('modalContainer');
  mc.innerHTML = `<div class="modal-overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><h3>${title}</h3><button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-navy" id="modalConfirmBtn">${confirmLabel}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modalConfirmBtn').onclick = onConfirm;
}
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }
function toast(msg, type='info') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle'}"></i> ${msg}`;
  c.appendChild(t);
  setTimeout(() => t.remove(), 4500);
}
function logAuditEntry(action, entityType, entityId, detail) {
  fetch('/api/v1/audit', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action, entity_type: entityType, entity_id: entityId, details: { detail }, user_id:'u001', user_name:'Fatima Al-Rashdi', user_role:'product_manager', source:'manual' }) }).catch(()=>{});
}
