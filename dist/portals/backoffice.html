/* ======================== MARKDOWN RENDERER ======================== */
function markdownToHtml(text) {
  return text
    // Bold **text** or __text__
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/__(.+?)__/g, '<strong>$1</strong>')
    // Italic *text*
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    // Numbered list: lines starting with "1. " etc → wrap whole block
    .replace(/((?:^|\n)\d+\.\s.+)+/g, function(block) {
      const items = block.trim().split(/\n/).map(l => l.replace(/^\d+\.\s+/, ''));
      return '<ol style="margin:.5rem 0 .5rem 1.2rem;line-height:1.9">' + items.map(i => '<li>' + i + '</li>').join('') + '</ol>';
    })
    // Bullet list: lines starting with "- " or "• "
    .replace(/((?:^|\n)[\-•]\s.+)+/g, function(block) {
      const items = block.trim().split(/\n/).map(l => l.replace(/^[\-•]\s+/, ''));
      return '<ul style="margin:.5rem 0 .5rem 1.2rem;line-height:1.9">' + items.map(i => '<li>' + i + '</li>').join('') + '</ul>';
    })
    // Line breaks
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

/* ======================== INIT ======================== */

  updateUserBadge();

async function loadUsers() {
  try {
    const r = await fetch('/api/v1/users');
    const d = await r.json();
    USERS = {};
    (d.users || []).forEach(u => { USERS[u.id] = u; });
  } catch(e) {
    // Fallback defaults if API fails
    USERS = {
      u001: { id:'u001', name:'Fatima Al-Rashdi',  name_ar:'فاطمة الراشدي',  department:'Product Management', avatar_initials:'FA', role:'product_manager' },
      u002: { id:'u002', name:'Aisha Al-Balushi',  name_ar:'عائشة البلوشي',  department:'Compliance & ESG',   avatar_initials:'AB', role:'compliance_officer' },
      u003: { id:'u003', name:'Omar Al-Mantheri',  name_ar:'عمر المنذري',    department:'Credit Risk',         avatar_initials:'OM', role:'risk_officer' },

    };
  }
}

async function loadMarket() {

    const r = await fetch('/api/v1/markets/default/current');
    const d = await r.json();
    activeMarket = d.market || null;
  } catch(e) {
    activeMarket = { id:'mkt001', name:'Oman', name_ar:'عُمان', currency_code:'OMR',
      currency_symbol:'ر.ع.', regulator_name:'CBO', country_code:'OM' };
  }
}

function renderMarketBadge() {
  const badge = document.getElementById('marketBadge');
  if (!badge || !activeMarket) return;
  const isAr = currentLang === 'ar';
  const name = isAr ? (activeMarket.name_ar || activeMarket.name) : activeMarket.name;
  badge.innerHTML = `<span style="font-size:1rem;margin-right:.25rem">${getFlagEmoji(activeMarket.country_code)}</span>
    <span style="font-weight:600">${name}</span>
    <span style="color:var(--grey-400);margin:0 .25rem">·</span>
    <span>${activeMarket.currency_code}</span>
    <span style="color:var(--grey-400);margin:0 .25rem">·</span>
    <span>${activeMarket.regulator_name}</span>`;
}

function getFlagEmoji(countryCode) {
  if (!countryCode || countryCode.length !== 2) return '🏳';
  return countryCode.toUpperCase().split('').map(c =>
    String.fromCodePoint(0x1F1E6 + c.charCodeAt(0) - 65)
  ).join('');
}

function updateUserBadge() {
  const u = currentUser();
  const el = document.getElementById('userAvatar');
  const nameEl = document.getElementById('userName');
  const roleEl = document.getElementById('userRole');
  if (el) el.textContent = u.avatar_initials || u.name?.charAt(0) || '?';
  if (nameEl) nameEl.textContent = currentLang === 'ar' ? (u.name_ar || u.name) : u.name;
  if (roleEl) roleEl.textContent = u.department || currentRole.replace(/_/g,' ');
}

const ROLE_BTN_ID = {
  product_manager: 'role-pm',
  compliance_officer: 'role-co',
  risk_officer: 'role-ro',
  operations: 'role-ops'
};

function switchRole(role) {
  currentRole = role;
  document.querySelectorAll('.portal-switch-btn').forEach(b => b.classList.remove('active'));
  const btnId = ROLE_BTN_ID[role];
  if (btnId) document.getElementById(btnId)?.classList.add('active');
  updateUserBadge();
  renderSidebar();
  const firstNav = ROLES[role].nav[0];
  renderPage(firstNav);
}

function setLang(lang) {
  currentLang = lang;
  const isAr = lang === 'ar';
  document.body.style.direction = isAr ? 'rtl' : 'ltr';
  document.documentElement.setAttribute('dir', isAr ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', isAr ? 'ar' : 'en');
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent.trim()===(isAr?'ع':'EN')));
  // Update all data-en/data-ar text nodes
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = isAr ? (el.getAttribute('data-ar') || el.getAttribute('data-en')) : el.getAttribute('data-en');
  });
  renderSidebar();
  renderMarketBadge();
  updateUserBadge();
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  const items = ROLES[currentRole].nav;
  nav.innerHTML = items.map(key => {
    const item = NAV_ITEMS[key];
    return `<div class="sidebar-item" onclick="renderPage('${key}')" id="nav-${key}">
      <i class="fas ${item.icon}"></i>
      <span>${currentLang==='ar' ? item.labelAr : item.label}</span>
    </div>`;
  }).join('');
}

function setActiveNav(key) {
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-'+key)?.classList.add('active');
}

/* ======================== PAGE ROUTER ======================== */

  main.innerHTML = '<div class="page"><div class="empty-state"><i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--grey-300)"></i></div></div>';
  
  switch(page) {
    case 'products': await loadProducts(); await renderProducts(); break;
    case 'rules': await renderRules(); break;
    case 'workflows': await renderWorkflows(); break;
    case 'compliance_config': await renderCompliance(); break;
    case 'audit_logs': await renderAuditLogs(); break;
    case 'tasks': await renderComplianceTasks(); break;
    case 'esg_review': await renderEsgReview(); break;
    case 'credit_review': await renderCreditReview(); break;
    case 'escrow': await renderEscrow(); break;
    case 'regulatory_reports': await renderReports(); break;
    default: {
      const pageLabel = NAV_ITEMS[page] ? (currentLang==='ar' ? NAV_ITEMS[page].labelAr : NAV_ITEMS[page].label) : page.replace(/_/g,' ');

      document.getElementById('pageSubtitle').textContent = '';
      main.innerHTML = renderEmptySection(page, pageLabel);

}

  } catch(e) { products = []; }
}

  document.getElementById('pageSubtitle').textContent = '';

  const catMeta = {
    home_loan:     { icon:'fa-house',         label:'Home Loans',     color:'#007F86' },
    auto_loan:     { icon:'fa-car',            label:'Auto Finance',   color:'#35C6C4' },
    personal_loan: { icon:'fa-user',           label:'Personal Loans', color:'#F4B35B' },
    sme:           { icon:'fa-briefcase',      label:'SME Finance',    color:'#003B5C' },
    commercial:    { icon:'fa-building',       label:'Commercial',     color:'#6c757d' },
    education:     { icon:'fa-graduation-cap', label:'Education',      color:'#a855f7' },
  };
  const catOrder = ['home_loan','auto_loan','personal_loan','sme','commercial','education'];
  const groups = {};
  for (const cat of catOrder) groups[cat] = [];
  for (const p of products) {
    if (!groups[p.category]) groups[p.category] = [];
    groups[p.category].push(p);

  const productCard = p => {
    const meta = catMeta[p.category] || {icon:'fa-file', label:p.category, color:'#aaa'};
    const isEsg = p.esg_required_docs && p.esg_required_docs !== '[]';
    const isAr = currentLang === 'ar';
    const stage = p.pge_stage || 0;
    const stagePct = Math.round((stage / 6) * 100);
    const stageLabel = stage > 0 ? (isAr ? `المرحلة ${stage}/6` : `Stage ${stage}/6`) : (isAr ? 'لم تبدأ' : 'Not started');

    return `<div class="product-card ${isEsg?'green':''} ${p.status==='draft'?'draft-card':''}" style="cursor:pointer;position:relative">

            <div class="product-card-title" style="display:flex;align-items:center;gap:.35rem;flex-wrap:nowrap;overflow:hidden">
              <i class="fas ${meta.icon}" style="color:${meta.color};font-size:.8rem;flex-shrink:0"></i>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1">${p.name}</span>

          </div>

        <div class="product-card-stats" onclick="openProductDetail('${p.id}')">
          <div class="product-stat"><strong>${p.base_rate||5.5}%</strong>${isAr?'السعر الأساسي':'Base Rate'}</div>

          <div class="product-stat"><strong>${p.max_ltv||90}%</strong>${isAr?'الحد الأقصى LTV':'Max LTV'}</div>
        </div>
        <div style="margin-top:.75rem;padding-top:.625rem;border-top:1px solid var(--grey-100)">

function filterProducts(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('.product-card').forEach(card => {
    const name = (card.querySelector('.product-card-title')||{textContent:''}).textContent.toLowerCase();
    card.style.display = name.includes(lq) ? '' : 'none';
  });
  // Hide category section headers when all their cards are hidden
  document.querySelectorAll('#productGrid > div').forEach(section => {
    const grid = section.querySelector('.product-grid');
    if (!grid) return;
    const visible = [...grid.querySelectorAll('.product-card')].some(c => c.style.display !== 'none');
    section.style.display = visible ? '' : 'none';
  });
}

// Track which product we're editing docs for
let _docEditProductId = null;
let _docEditCurrentList = [];
let _catalogueSelectedKeys = new Set();

function openDocCatalogue(productId) {
  _docEditProductId = productId;
  _catalogueSelectedKeys = new Set();
  // Get current docs from the displayed list
  const prod = products.find(x => x.id === productId);
  _docEditCurrentList = prod ? (() => { try { return JSON.parse(prod.required_docs||'[]'); } catch{return[];} })() : [];

  // Group catalogue by category
  const groups = {};
  DOC_CATALOGUE.forEach(d => {
    if (!groups[d.group]) groups[d.group] = [];
    groups[d.group].push(d);
  });

  const alreadyAdded = new Set(_docEditCurrentList);
  let html = '';
  for (const [group, items] of Object.entries(groups)) {
    html += `<div style="font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--grey-400);letter-spacing:.06em;margin:.6rem 0 .25rem">${group}</div>`;
    items.forEach(item => {
      const already = alreadyAdded.has(item.key);
      html += `<label style="display:flex;align-items:center;gap:.5rem;padding:.35rem .5rem;border-radius:6px;cursor:${already?'not-allowed':'pointer'};background:${already?'var(--grey-50)':'white'};opacity:${already?'.5':'1'};border:1px solid transparent" ${already?'':'onmouseover="this.style.background=\'var(--grey-50)\'" onmouseout="this.style.background=\'white\'"'}>
        <input type="checkbox" value="${item.key}" ${already?'disabled checked':''}
          onchange="toggleCatalogueItem('${item.key}',this.checked)"
          style="accent-color:var(--navy)">
        <span style="font-size:.82rem;font-weight:500;color:var(--navy-dark)">${item.label}</span>
        <code style="margin-left:auto;font-size:.67rem;color:var(--grey-400)">${item.key}</code>
      </label>`;
    });
  }
  document.getElementById('catalogueItems').innerHTML = html;

  const modal = document.getElementById('docCatalogueModal');
  modal.style.display = 'flex';
}

function toggleCatalogueItem(key, checked) {
  if (checked) _catalogueSelectedKeys.add(key);
  else _catalogueSelectedKeys.delete(key);
}

function closeDocCatalogue() {
  const modal = document.getElementById('docCatalogueModal');
  if (modal) modal.style.display = 'none';
}

async function saveSelectedDocs(productId) {
  if (_catalogueSelectedKeys.size === 0) { closeDocCatalogue(); return; }
  const prod = products.find(x => x.id === productId);
  const current = prod ? (() => { try { return JSON.parse(prod.required_docs||'[]'); } catch{return[];} })() : [];
  const newList = [...current, ...[..._catalogueSelectedKeys].filter(k => !current.includes(k))];
  await patchProductDocs(productId, newList);
  closeDocCatalogue();
}

async function removeDoc(productId, docKey) {
  const prod = products.find(x => x.id === productId);
  const current = prod ? (() => { try { return JSON.parse(prod.required_docs||'[]'); } catch{return[];} })() : [];
  const newList = current.filter(k => k !== docKey);
  await patchProductDocs(productId, newList);
}

async function addManualDoc(productId) {
  const input = document.getElementById('manualDocInput');
  const raw = input ? input.value.trim() : '';
  if (!raw) return;
  // Normalise: lowercase, spaces → underscores, strip special chars
  const key = raw.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
  if (!key) { toast('Invalid document key','error'); return; }
  const prod = products.find(x => x.id === productId);
  const current = prod ? (() => { try { return JSON.parse(prod.required_docs||'[]'); } catch{return[];} })() : [];
  if (current.includes(key)) { toast('Document already in list','info'); return; }
  await patchProductDocs(productId, [...current, key]);
  if (input) input.value = '';
}

async function patchProductDocs(productId, newDocList) {
  try {
    const r = await fetch(`/api/v1/products/${productId}`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ required_docs: JSON.stringify(newDocList) })
    });
    const d = await r.json();
    if (d.success) {
      // Update local cache
      const prod = products.find(x => x.id === productId);
      if (prod) prod.required_docs = JSON.stringify(newDocList);
      toast('Documents updated', 'success');
      // Re-open the same tab to refresh display
      switchProductTab('documents', productId);
    } else { toast(d.error||'Failed to update documents','error'); }
  } catch(e) { toast(e.message,'error'); }
}

    eligibility: `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <h4>Eligibility Rules</h4>
        <button class="btn btn-ghost btn-sm" onclick="renderPage('rules');renderRules('${p.id}');closePanel()"><i class="fas fa-external-link-alt"></i> View in Rules Engine</button>
      </div>
      <!-- AI-injected rules appear here (prepended by dispatchUiEvents add_rule) -->
      <div id="rulesList" style="margin-bottom:.75rem"></div>
      ${(() => {
        // Separate product-specific from global (product_id null)
        const specificRules = productRules.filter(r => r.is_active && r.product_id === p.id);
        const globalRuleList = productRules.filter(r => r.is_active && !r.product_id);

        function eligibilityTable(ruleList) {
          return '<div style="background:var(--grey-50);border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--grey-200)">' +
            '<div style="display:grid;grid-template-columns:2fr 1.2fr 1.5fr 1.5fr .8fr;padding:.45rem .75rem;font-size:.68rem;font-weight:600;color:var(--grey-500);text-transform:uppercase;border-bottom:1px solid var(--grey-200);background:var(--grey-100)">' +
            '<span>Rule Name</span><span>Category</span><span>Condition</span><span>Reference</span><span>Severity</span></div>' +
            ruleList.map(r => `
            <div style="display:grid;grid-template-columns:2fr 1.2fr 1.5fr 1.5fr .8fr;padding:.55rem .75rem;font-size:.8rem;border-bottom:1px solid var(--grey-100);align-items:center">
              <span style="font-weight:500;color:var(--navy)">${r.name}</span>
              <span class="rule-category-tag rule-cat-${r.category}" style="font-size:.68rem">${r.category}</span>
              <span style="font-family:monospace;font-size:.75rem;color:var(--teal)">${r.metric} ${r.operator} ${r.threshold_value??r.threshold_condition??'–'}</span>
              <span style="font-size:.72rem;color:var(--grey-500)">${r.regulatory_reference||'–'}</span>
              <span class="badge ${r.severity==='hard'?'badge-red':'badge-amber'}">${r.severity}</span>
            </div>`).join('') + '</div>';
        }

        let html = '';

        // Product-specific rules first
        if (specificRules.length) {
          html += `<div style="margin-bottom:1rem">
            <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem">
              <span style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--teal)"><i class="fas fa-cube"></i> ${p.name} — Product Rules</span>
              <span style="font-size:.68rem;color:var(--grey-400)">${specificRules.length} rule${specificRules.length!==1?'s':''}</span>
            </div>
            ${eligibilityTable(specificRules)}
          </div>`;
        } else {
          html += `<div style="margin-bottom:1rem;padding:.6rem .75rem;background:rgba(0,127,134,.06);border:1px dashed var(--teal);border-radius:var(--radius-md);font-size:.8rem;color:var(--grey-500)">
            <i class="fas fa-info-circle" style="color:var(--teal)"></i> No product-specific rules configured for ${p.name} yet.
          </div>`;
        }

        // Global CBO rules
        if (globalRuleList.length) {
          html += `<div>
            <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem">
              <span style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--grey-500)"><i class="fas fa-gavel"></i> CBO Global Rules</span>
              <span style="font-size:.68rem;color:var(--grey-400)">${globalRuleList.length} rule${globalRuleList.length!==1?'s':''} · applies to all products</span>
            </div>
            ${eligibilityTable(globalRuleList)}
          </div>`;
        }

        if (!specificRules.length && !globalRuleList.length) {
          html = '<p style="color:var(--grey-500);font-size:.85rem;padding:.5rem 0">No eligibility rules found.</p>';
        }
        return html;
      })()}`,

            <span style="font-size:.76rem;color:rgba(255,255,255,.85);flex:1">All stages complete. Ready to save.</span>
            <button class="btn btn-success btn-sm" onclick="confirmAiProduct('${p.id}')" style="font-size:.72rem"><i class="fas fa-rocket"></i> Confirm</button>
          </div>
        </div>
      </div>`
  };

  document.getElementById('panelBody').innerHTML = `
    <div class="tabs">${tabs.map(t=>`<div class="tab ${t===selectedTab?'active':''}" onclick="switchProductTab('${t}','${p.id}')">${tabLabels[t]}</div>`).join('')}</div>
    <div class="tab-content" id="productTabContent">
      ${tabContent[selectedTab]||''}
    </div>
    <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--grey-200);display:flex;gap:.75rem;">
      ${p.status!=='active' ? `<button class="btn btn-success" onclick="publishProduct('${p.id}')"><i class="fas fa-rocket"></i> Publish Product</button>` : '<span class="badge badge-active" style="align-self:center"><i class="fas fa-check-circle"></i> Live</span>'}
      <button class="btn btn-ghost" onclick="cloneProduct('${p.id}','${p.name}')"><i class="fas fa-copy"></i> Clone</button>
    </div>`;
  openPanel(p.name);
  // Async: load workflow template for the Workflow tab
  if (selectedTab === 'workflow') {
    loadProductWorkflowTemplate(p);
  }
  // AI Studio tab: show welcome + reset pills if no thread active
  if (selectedTab === 'ai_assistant') {
    aiProductIdContext = p.id;
    setTimeout(() => {
      // Reset pills to current stage (if thread already running, keep stage)
      if (aiCurrentStage > 0) renderRoadmap(aiCurrentStage);
      // If no thread exists, show welcome
      const log = document.getElementById('ai-chat-log');
      if (log && !log.children.length && !aiThreadId) {
        appendChatBubble('assistant',
          'I\'m your <strong>AI Product Specialist</strong> for <em>' + p.name + '</em>. I can help you refine this product through a structured <strong>6-stage</strong> process, or answer specific configuration questions.<br><br>'
          + '<div style="margin:5px 0;padding:6px 9px;background:rgba(53,198,196,.1);border-left:3px solid var(--sea-glass);border-radius:0 6px 6px 0;font-size:.76rem;color:rgba(255,255,255,.65)">'
          + '<i class="fas fa-bolt" style="margin-right:4px;color:var(--sea-glass)"></i>'
          + 'As I configure each stage, the tabs on the left will update automatically in real time.'
          + '</div><br>'
          + '<strong>What would you like to do?</strong><br>'
          + '<small style="color:rgba(255,255,255,.4)">Example: "Walk me through all 6 stages" · "Add a green discount rule" · "Set the approval workflow"</small>'
        );
      }
    }, 150);
  }
}

        <div style="display:flex;align-items:center;gap:.75rem;flex:1">

          <div>
            <div style="font-weight:700;color:var(--navy)">${t.name}</div>
            ${t.name_ar ? `<div style="font-size:.72rem;color:var(--grey-400);direction:rtl;font-family:'Noto Sans Arabic',sans-serif">${t.name_ar}</div>` : ''}

          <span style="font-size:.67rem;padding:.15rem .4rem;border-radius:4px;background:' + (t.is_active ? 'var(--success-light)' : 'var(--grey-100)') + ';color:' + (t.is_active ? 'var(--success)' : 'var(--grey-400)') + ';font-weight:600">' + (t.is_active ? 'Active' : 'Inactive') + '</span>
        </div>
      </div>
      <div class="card-body">
        ${t.description ? `<p style="font-size:.82rem;color:var(--grey-600);margin-bottom:.75rem;line-height:1.5">${t.description}</p>` : ''}
        <div style="display:flex;gap:1.5rem;font-size:.78rem;color:var(--grey-500);margin-bottom:1rem">
          <span><i class="fas fa-project-diagram" style="margin-right:.25rem"></i>${nodes.length} nodes</span>

        </div>

  }
}

function switchProductTab(tab, productId) {
  selectedTab = tab;
  openProductDetail(productId);

/* ======================== AI PRODUCT STUDIO (multi-turn) ======================== */
let aiThreadId = null;
let aiProductDraft = null;
let aiCurrentStage = 0;       // tracks which stage we're on (0 = not started)
let aiProductIdContext = null; // productId this session is operating on

/* ── Stage names ─────────────────────────────────────────────────────────── */
const AI_STAGE_LABELS = ['Product Model','Core Config','Rules','Workflow','Compliance','Simulation'];
const AI_STAGE_ICONS  = ['fa-layer-group','fa-sliders','fa-list-check','fa-sitemap','fa-shield-halved','fa-chart-line'];

/* ── resetAiChat ─────────────────────────────────────────────────────────── */
function resetAiChat(productId) {
  aiThreadId = null; aiProductDraft = null;
  aiCurrentStage = 0; aiProductIdContext = productId || null;
  // Clear live draft state
  Object.keys(aiDraftConfig).forEach(k => delete aiDraftConfig[k]);
  aiDraftRules = []; aiDraftWorkflow = [];
  _lastDraftSnapshot = { _rCount: 0, _wCount: 0 };   // reset highlight tracker
  const log = document.getElementById('ai-chat-log');
  if (log) log.innerHTML = '';
  const bar = document.getElementById('ai-confirm-bar');
  if (bar) bar.style.display = 'none';
  const draftCard = document.getElementById('ai-draft-card');
  if (draftCard) draftCard.remove();
  const strip = document.getElementById('ai-roadmap-strip');
  if (strip) strip.remove();
  // Reset all stage pills to inactive
  for (let i = 0; i < 6; i++) {
    const pill = document.getElementById('pill-' + i);
    if (pill) {
      pill.style.background = 'rgba(255,255,255,.08)';
      pill.style.color = 'rgba(255,255,255,.4)';
      pill.style.borderColor = 'rgba(255,255,255,.1)';
    }
  }
}

/* ── appendChatBubble ────────────────────────────────────────────────────── */
function appendChatBubble(role, html) {
  const log = document.getElementById('ai-chat-log');
  if (!log) return;
  const isUser = role === 'user';
  const el = document.createElement('div');
  el.style.cssText = 'display:flex;justify-content:' + (isUser ? 'flex-end' : 'flex-start');
  el.innerHTML = '<div style="max-width:88%;padding:9px 13px;border-radius:12px;font-size:.82rem;line-height:1.6;background:'
    + (isUser ? 'rgba(53,198,196,.2)' : 'rgba(255,255,255,.07)')
    + ';color:rgba(255,255,255,.9)">' + html + '</div>';
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

/* ── renderRoadmap ───────────────────────────────────────────────────────── *
 * Updates the compact horizontal progress bar pinned at bottom of chat area
 * AND advances the header stage pills.
 * Called whenever show_roadmap=true OR current_stage changes.
 * ─────────────────────────────────────────────────────────────────────────*/
function renderRoadmap(activeStage) {
  aiCurrentStage = activeStage;

  // 1. Update header stage pills
  for (let i = 0; i < 6; i++) {
    const pill = document.getElementById('pill-' + i);
    if (!pill) continue;
    const n = i + 1;
    if (n < activeStage) {
      pill.style.cssText += ';background:rgba(22,132,91,.25);color:#4ade80;border-color:rgba(74,222,128,.35);box-shadow:none';
    } else if (n === activeStage) {
      pill.style.cssText += ';background:rgba(53,198,196,.22);color:var(--sea-glass);border-color:rgba(53,198,196,.5);box-shadow:0 0 6px rgba(53,198,196,.3)';
    } else {
      pill.style.cssText += ';background:rgba(255,255,255,.08);color:rgba(255,255,255,.4);border-color:rgba(255,255,255,.1);box-shadow:none';
    }
  }

  // 2. Update (or create) the compact horizontal roadmap strip
  // It lives OUTSIDE the chat-log, pinned just above the input area
  let strip = document.getElementById('ai-roadmap-strip');
  if (!strip) {
    // Find the input wrapper and insert the strip before it
    const inputWrapper = document.getElementById('aiInputWrapper');
    if (!inputWrapper) return;
    strip = document.createElement('div');
    strip.id = 'ai-roadmap-strip';
    strip.style.cssText = 'display:flex;align-items:center;gap:0;padding:.35rem .75rem;background:rgba(0,0,0,.25);border-top:1px solid rgba(255,255,255,.07);flex-shrink:0';
    inputWrapper.parentNode.insertBefore(strip, inputWrapper);
  }

  strip.innerHTML = AI_STAGE_LABELS.map((label, i) => {
    const n = i + 1;
    const done   = n < activeStage;
    const active = n === activeStage;
    const dotBg  = done ? '#4ade80' : active ? 'var(--sea-glass)' : 'rgba(255,255,255,.18)';
    const txtColor = done ? '#4ade80' : active ? 'var(--sea-glass)' : 'rgba(255,255,255,.32)';
    const fw = active ? '700' : '400';
    const dotContent = done ? '✓' : String(n);
    // connector line between steps
    const connector = i < 5
      ? '<div style="flex:1;height:1px;background:' + (done ? 'rgba(74,222,128,.4)' : 'rgba(255,255,255,.12)') + ';margin:0 3px"></div>'
      : '';
    return '<div style="display:flex;align-items:center;flex-shrink:0">'
      + '<div style="display:flex;flex-direction:column;align-items:center;gap:2px">'
        + '<div style="width:18px;height:18px;border-radius:50%;background:' + dotBg + ';display:flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:700;color:' + (active||done ? '#0d2233' : 'rgba(255,255,255,.4)') + '">' + dotContent + '</div>'
        + '<span style="font-size:.56rem;font-weight:' + fw + ';color:' + txtColor + ';white-space:nowrap;max-width:56px;overflow:hidden;text-overflow:ellipsis">' + label + '</span>'
      + '</div>'
    + '</div>'
    + connector;
  }).join('');
}

/* ── Live draft state — accumulates field values from set_field events ──────
 * Used in standalone AI Studio to show a live config card (no product panel).
 * ─────────────────────────────────────────────────────────────────────────*/
const aiDraftConfig = {};
let aiDraftRules = [];
let aiDraftWorkflow = [];

/* ── Draft card highlight tracking ──────────────────────────────────────── *
 * _lastDraftSnapshot: shallow copy of aiDraftConfig + rule/wf counts from  *
 * the last render; used to detect which fields actually changed so we can   *
 * flash only those spans in the summary bar.                                *
 * ─────────────────────────────────────────────────────────────────────────*/
let _lastDraftSnapshot = { _rCount: 0, _wCount: 0 };

/* Apply draftFlash animation to every [data-flash] element inside `card`. */
function _flashDraftFields(card) {
  if (!card) return;
  card.querySelectorAll('[data-flash]').forEach(el => {
    el.style.animation = 'none';
    // Force reflow so the animation restarts cleanly
    void el.offsetWidth;
    el.style.animation = 'draftFlash .95s ease forwards';
    el.removeAttribute('data-flash');
  });
}

/* Pulse the card border for ~1.1 s (stage-completion signal). */
function _pulseDraftBorder() {
  const card = document.getElementById('ai-draft-card');
  if (!card) return;
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'draftBorderPulse 1.1s ease';
  setTimeout(() => { card.style.animation = ''; }, 1200);
}

/* ── updateAiDraftCard ───────────────────────────────────────────────────── *
 * Renders / updates the live configuration card at bottom of AI chat.
 * Supports collapsed summary view (default) and expanded full view.
 * Called whenever set_field / add_rule / set_workflow events arrive.
 * ─────────────────────────────────────────────────────────────────────────*/
let aiDraftCardExpanded = false;

function updateAiDraftCard() {
  let card = document.getElementById('ai-draft-card');
  if (!card) {
    const inputWrapper = document.getElementById('aiInputWrapper');
    if (!inputWrapper) return;
    card = document.createElement('div');
    card.id = 'ai-draft-card';
    card.style.cssText = 'margin:.35rem 1rem;background:rgba(0,59,92,.6);border:1px solid rgba(53,198,196,.32);border-radius:9px;font-size:.77rem;animation:fadeIn .4s ease;overflow:hidden;max-height:460px;display:flex;flex-direction:column';
    inputWrapper.parentNode.insertBefore(card, inputWrapper);
  }
  const cfg = aiDraftConfig;
  const rCount = aiDraftRules.length;
  const wCount = aiDraftWorkflow.length;
  const exp = aiDraftCardExpanded;

  const fr = (label, val, color) => val != null
    ? `<div style="display:flex;justify-content:space-between;padding:.14rem 0;border-bottom:1px solid rgba(255,255,255,.04)">
        <span style="color:rgba(255,255,255,.42);font-size:.72rem">${label}</span>
        <span style="color:${color||'rgba(255,255,255,.84)'};font-weight:600;font-size:.73rem">${val}</span>
       </div>` : '';

  // ── Summary (always visible — compact: name, rate, term range, max amount, badges) ─
  // Build concise rate string: base rate + best effective rate if discounts exist
  const effectiveRate = cfg.green_discount_premium != null
    ? ((cfg.base_rate||5.25) - (cfg.green_discount_premium||0.75)).toFixed(2) + '%'
    : null;
  const rateStr = cfg.base_rate != null
    ? cfg.base_rate + '%' + (effectiveRate ? ' → ' + effectiveRate : '')
    : null;
  const termStr = cfg.max_term != null
    ? (cfg.min_term||3) + '\u2013' + cfg.max_term + ' yrs'
    : null;
  const amountStr = cfg.max_amount != null
    ? 'OMR\u00a0' + Number(cfg.max_amount).toLocaleString()
    : null;

  const compliance = cfg._compliance || null;

  // ── Diff against last snapshot to know which values are NEW / changed ────
  const snap = _lastDraftSnapshot;
  const nameChanged       = cfg.name       != null && cfg.name       !== snap.name;
  const rateChanged       = rateStr        != null && rateStr        !== snap._rateStr;
  const termChanged       = termStr        != null && termStr        !== snap._termStr;
  const amountChanged     = amountStr      != null && amountStr      !== snap._amountStr;
  const rCountChanged     = rCount > (snap._rCount || 0);
  const wCountChanged     = wCount > (snap._wCount || 0);
  const complianceChanged = compliance != null && JSON.stringify(compliance) !== snap._compliance;

  // Helper: wrap a value in a flash-marked span when it changed
  const maybeFlash = (changed, inner) => changed
    ? `<span data-flash="1" style="display:inline">${inner}</span>`
    : inner;

  // Badge animation style strings (applied inline so they self-remove cleanly)
  const ruleBadgeAnim  = rCountChanged ? 'animation:draftBadgeFlash .95s ease forwards'   : '';
  const wfBadgeAnim    = wCountChanged ? 'animation:draftWfBadgeFlash .95s ease forwards' : '';

  const summaryHtml =
    `<div style="padding:.5rem .85rem .35rem;flex-shrink:0">` +
    `<div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem">` +
      `<i class="fas fa-file-invoice" style="color:var(--sea-glass);font-size:.75rem"></i>` +
      `<span style="font-weight:700;color:rgba(255,255,255,.9);font-size:.78rem">Product Draft</span>` +
      `<span style="font-size:.58rem;color:rgba(255,255,255,.28);margin-left:.1rem">live preview</span>` +
      (rCount > 0 || wCount > 0 ? `<button onclick="aiDraftCardExpanded=!aiDraftCardExpanded;updateAiDraftCard()" style="margin-left:auto;background:rgba(53,198,196,.12);border:1px solid rgba(53,198,196,.25);color:var(--sea-glass);border-radius:5px;padding:.1rem .45rem;font-size:.62rem;cursor:pointer;white-space:nowrap"><i class="fas fa-${exp ? 'compress-alt' : 'expand-alt'}" style="margin-right:.18rem"></i>${exp ? 'Collapse' : 'Expand'}</button>` : '') +
    `</div>` +
    (cfg.name ? `<div style="font-size:.75rem;font-weight:600;color:var(--sea-glass);margin-bottom:.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${maybeFlash(nameChanged, cfg.name)}</div>` : '') +
    `<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">` +
      (rateStr   ? `<span style="font-size:.72rem;color:rgba(255,255,255,.85);font-weight:600">${maybeFlash(rateChanged,   rateStr)}</span>`                  : '') +
      (termStr   ? `<span style="font-size:.68rem;color:rgba(255,255,255,.45)">&middot; ${maybeFlash(termChanged,   termStr)}</span>`                         : '') +
      (amountStr ? `<span style="font-size:.68rem;color:rgba(255,255,255,.45)">up to ${maybeFlash(amountChanged, amountStr)}</span>`                          : '') +
    `</div>` +
    `<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.28rem">` +
      (rCount > 0 ? `<span style="font-size:.64rem;background:rgba(53,198,196,.1);color:var(--sea-glass);padding:.08rem .4rem;border-radius:8px;border:1px solid rgba(53,198,196,.2);${ruleBadgeAnim}"><i class="fas fa-list-check" style="margin-right:.2rem"></i>${rCount} rules</span>` : '') +
      (wCount > 0 ? `<span style="font-size:.64rem;background:rgba(244,179,91,.1);color:#fbbf24;padding:.08rem .4rem;border-radius:8px;border:1px solid rgba(244,179,91,.2);${wfBadgeAnim}"><i class="fas fa-sitemap" style="margin-right:.2rem"></i>${wCount} steps</span>` : '') +
      (compliance ? maybeFlash(complianceChanged,
        `<span style="font-size:.64rem;background:rgba(248,113,113,.1);color:#f87171;padding:.08rem .4rem;border-radius:8px;border:1px solid rgba(248,113,113,.2)"><i class="fas fa-shield-halved" style="margin-right:.2rem"></i>Basel ${compliance.risk_weight} · IFRS9 ${compliance.provisioning} · AML ${compliance.aml}</span>`
      ) : '') +
    `</div>` +
    `</div>`;

  // ── Expanded sections (scrollable) ─────────────────────────────────────
  let expandedHtml = '';
  if (exp) {
    // Rules section
    if (rCount > 0) {
      const catColors = {creditworthiness:'#60a5fa',esg:'#4ade80',collateral:'#fbbf24',eligibility:'#c084fc',compliance:'#f87171'};
      const sevColors = {hard:'#f87171',soft:'#fbbf24',warning:'#60a5fa'};
      expandedHtml += `<div style="border-top:1px solid rgba(255,255,255,.08);padding:.55rem .85rem">` +
        `<div style="font-size:.7rem;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.4rem">` +
          `<i class="fas fa-list-check" style="color:var(--sea-glass);margin-right:.3rem"></i>Eligibility Rules (${rCount})` +
        `</div>` +
        aiDraftRules.map(r =>
          `<div style="display:flex;align-items:flex-start;gap:.4rem;padding:.3rem .4rem;margin-bottom:.25rem;background:rgba(255,255,255,.03);border-radius:5px;border-left:3px solid ${sevColors[r.severity]||'#60a5fa'}">` +
            `<div style="flex:1;min-width:0">` +
              `<div style="font-size:.72rem;font-weight:600;color:rgba(255,255,255,.85)">${r.name||r.metric||'Rule'}</div>` +
              `<div style="font-size:.63rem;color:rgba(255,255,255,.38);margin-top:.05rem">${r.regulatory_reference||''}</div>` +
              (r.description ? `<div style="font-size:.62rem;color:rgba(255,255,255,.28);margin-top:.07rem">${r.description.slice(0,90)}${r.description.length>90?'…':''}</div>` : '') +
            `</div>` +
            `<div style="flex-shrink:0;text-align:right">` +
              `<span style="font-size:.63rem;background:rgba(53,198,196,.12);color:var(--sea-glass);padding:.08rem .3rem;border-radius:6px;white-space:nowrap">${r.metric||''} ${r.operator||''} ${r.threshold_value??''}</span><br>` +
              `<span style="font-size:.6rem;color:${catColors[r.category]||'rgba(255,255,255,.3)'};text-transform:uppercase">${r.category||''}</span>` +
            `</div>` +
          `</div>`
        ).join('') +
      `</div>`;
    }
    // Workflow section
    if (wCount > 0) {
      const typeIcons = {start:'fa-play-circle',end:'fa-flag-checkered',approval:'fa-user-check',task:'fa-cog',decision:'fa-code-branch'};
      expandedHtml += `<div style="border-top:1px solid rgba(255,255,255,.08);padding:.55rem .85rem">` +
        `<div style="font-size:.7rem;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.4rem">` +
          `<i class="fas fa-sitemap" style="color:#fbbf24;margin-right:.3rem"></i>Approval Workflow (${wCount} steps)` +
        `</div>` +
        aiDraftWorkflow.map((n, idx) =>
          `<div style="display:flex;align-items:flex-start;gap:.4rem;margin-bottom:.3rem">` +
            `<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0">` +
              `<div style="width:22px;height:22px;border-radius:50%;background:${n.type==='start'?'rgba(53,198,196,.25)':n.type==='end'?'rgba(22,132,91,.25)':n.auto?'rgba(244,179,91,.15)':'rgba(255,255,255,.08)'};border:1px solid ${n.type==='start'?'rgba(53,198,196,.4)':n.type==='end'?'rgba(22,132,91,.4)':n.auto?'rgba(244,179,91,.3)':'rgba(255,255,255,.15)'};display:flex;align-items:center;justify-content:center">` +
                `<i class="fas ${typeIcons[n.type]||'fa-circle'}" style="font-size:.55rem;color:${n.type==='start'?'var(--sea-glass)':n.type==='end'?'#4ade80':n.auto?'#fbbf24':'rgba(255,255,255,.5)'}"></i>` +
              `</div>` +
              (idx < aiDraftWorkflow.length-1 ? `<div style="width:1px;height:10px;background:rgba(255,255,255,.1);margin:.05rem 0"></div>` : '') +
            `</div>` +
            `<div style="flex:1;min-width:0;padding-top:.1rem">` +
              `<div style="font-size:.72rem;font-weight:600;color:rgba(255,255,255,.85)">${n.label||n.id}` +
                (n.auto ? `<span style="font-size:.58rem;background:rgba(244,179,91,.15);color:#fbbf24;padding:.07rem .28rem;border-radius:4px;margin-left:.3rem">AUTO</span>` : '') +
              `</div>` +
              (n.role || n.sla_hours ? `<div style="font-size:.63rem;color:rgba(255,255,255,.35)">${(n.role||'').replace(/_/g,' ')}${n.sla_hours ? ' · SLA '+n.sla_hours+'h' : ''}</div>` : '') +
              (n.description ? `<div style="font-size:.62rem;color:rgba(255,255,255,.25);margin-top:.05rem">${n.description.slice(0,80)}${n.description.length>80?'…':''}</div>` : '') +
            `</div>` +
          `</div>`
        ).join('') +
      `</div>`;
    }
    // If nothing to expand yet
    if (rCount === 0 && wCount === 0) {
      expandedHtml += `<div style="border-top:1px solid rgba(255,255,255,.08);padding:.5rem .85rem;font-size:.72rem;color:rgba(255,255,255,.3);text-align:center">More details will appear as we progress through the stages.</div>`;
    }
  }

  // Wrap expanded section in a scrollable container
  if (exp && expandedHtml) {
    card.innerHTML = summaryHtml +
      `<div style="overflow-y:auto;flex:1;min-height:0;border-top:1px solid rgba(255,255,255,.07);max-height:320px">${expandedHtml}</div>`;
  } else {
    card.innerHTML = summaryHtml + expandedHtml;
  }

  // ── Apply flash animations to [data-flash] spans post-render ─────────────
  _flashDraftFields(card);

  // ── Update snapshot so next render only flashes truly new changes ─────────
  _lastDraftSnapshot = Object.assign({}, cfg, {
    _rateStr:    rateStr,
    _termStr:    termStr,
    _amountStr:  amountStr,
    _rCount:     rCount,
    _wCount:     wCount,
    _compliance: compliance ? JSON.stringify(compliance) : null,
  });
}

/* ── dispatchUiEvents ─────────────────────────────────────────────────────
 * Processes ui_events from the AI response.
 * Works in both product-panel mode (productId set) and standalone mode.
 * In standalone mode, set_field events update the live draft card in chat.
 * ─────────────────────────────────────────────────────────────────────────*/
async function dispatchUiEvents(events, productId) {
  if (!events || !events.length) return;
  const FIELD_MAP = {
    name:'pName', description:'pDesc', base_rate:'pRate', max_ltv:'pMaxLtv',
    max_dbr:'pMaxDbr', green_dbr:'pGreenDbr', max_term:'pMaxTerm', min_term:'pMinTerm',
    min_amount:'pMinAmount', max_amount:'pMaxAmount', gsas_min_score:'pGsasMin',
    gsas_premium_score:'pGsasPremium', green_discount_standard:'pGreenDiscStd',
    green_discount_premium:'pGreenDiscPrem',
  };
  function flashField(el) {
    if (!el) return;
    const orig = el.style.background||'', origT = el.style.transition||'';
    el.style.transition='background .25s'; el.style.background='rgba(253,224,71,.35)';
    setTimeout(() => { el.style.background=orig; el.style.transition=origT; }, 1800);
  }
  const targetId = productId || aiProductIdContext;
  for (const ev of events) {
    /* set_tab */
    if (ev.type === 'set_tab' && ev.tab) {
      if (targetId) { switchProductTab(ev.tab, targetId); await new Promise(r => setTimeout(r, 220)); }
      continue;
    }
    /* set_field — always update live draft card; also update product panel if open */
    if (ev.type === 'set_field' && ev.field != null && ev.value != null) {
      aiDraftConfig[ev.field] = ev.value;
      updateAiDraftCard();
      const domId = FIELD_MAP[ev.field];
      if (domId) { const el = document.getElementById(domId); if (el) { el.value = ev.value; el.dispatchEvent(new Event('input',{bubbles:true})); flashField(el); } }
      continue;
    }
    /* highlight_field */
    if (ev.type === 'highlight_field' && ev.field) {
      const domId = FIELD_MAP[ev.field];
      if (domId) flashField(document.getElementById(domId));
      continue;
    }
    /* add_rule */
    if (ev.type === 'add_rule' && ev.rule) {
      const rule = ev.rule;
      aiDraftRules.push(rule);
      updateAiDraftCard();
      const container = document.getElementById('rulesList');
      if (container) {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:flex-start;gap:.5rem;padding:.55rem .75rem;background:rgba(53,198,196,.07);border:1px solid rgba(53,198,196,.2);border-radius:6px;margin-bottom:.4rem;animation:fadeIn .4s ease';
        const sc = rule.severity==='hard'?'#f87171':rule.severity==='soft'?'#fbbf24':'#60a5fa';
        const cc = {creditworthiness:'#60a5fa',esg:'#4ade80',collateral:'#fbbf24',eligibility:'#c084fc'};
        row.innerHTML =
          '<span style="width:7px;height:7px;border-radius:50%;background:'+sc+';flex-shrink:0;margin-top:4px"></span>'+
          '<div style="flex:1;min-width:0">'+
            '<div style="font-size:.78rem;font-weight:600;color:rgba(255,255,255,.9)">'+(rule.name||rule.metric||'Rule')+'</div>'+
            '<div style="font-size:.67rem;color:rgba(255,255,255,.38);margin-top:.1rem">'+(rule.regulatory_reference||rule.category||'')+'</div>'+
            (rule.description?'<div style="font-size:.65rem;color:rgba(255,255,255,.28);margin-top:.12rem">'+rule.description.slice(0,130)+(rule.description.length>130?'\u2026':'')+'</div>':'')+
          '</div>'+
          '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:.2rem;flex-shrink:0">'+
            '<span style="font-size:.68rem;background:rgba(53,198,196,.15);color:var(--sea-glass);padding:.12rem .4rem;border-radius:10px;white-space:nowrap">'+(rule.metric||'')+' '+(rule.operator||'')+' '+(rule.threshold_value??'')+'</span>'+
            (rule.ai_confidence?'<span style="font-size:.63rem;color:rgba(255,255,255,.3)">AI '+rule.ai_confidence+'%</span>':'')+
            '<span style="font-size:.62rem;color:'+(cc[rule.category]||'rgba(255,255,255,.3)')+';text-transform:uppercase">'+(rule.category||'')+'</span>'+
          '</div>';
        row.style.background='rgba(53,198,196,.22)';
        setTimeout(()=>{row.style.background='rgba(53,198,196,.07)';},1600);
        container.prepend(row);
      }
      continue;
    }
    /* set_workflow */
    if (ev.type === 'set_workflow' && Array.isArray(ev.nodes)) {
      aiDraftWorkflow = ev.nodes;
      updateAiDraftCard();
      const wfContainer = document.getElementById('workflowCanvas');
      if (wfContainer) {
        wfContainer.innerHTML = ev.nodes.map((n, idx) => {
          const isEnd=n.type==='end', isStart=n.type==='start';
          const im={start:'fa-play-circle',end:'fa-flag-checkered',approval:'fa-user-check',task:'fa-cog',decision:'fa-code-branch'};
          const bg=isStart?'rgba(53,198,196,.15)':isEnd?'rgba(22,132,91,.15)':n.auto?'rgba(244,179,91,.08)':'rgba(255,255,255,.06)';
          const bc=isStart?'rgba(53,198,196,.4)':isEnd?'rgba(22,132,91,.4)':n.auto?'rgba(244,179,91,.25)':'rgba(255,255,255,.12)';
          return '<div style="display:flex;align-items:center;gap:0;flex-direction:column">'+
            (idx>0?'<div style="width:2px;height:12px;background:rgba(255,255,255,.15);margin:0 auto"></div>':'')+
            '<div style="padding:.45rem .8rem;border-radius:8px;background:'+bg+';border:1px solid '+bc+';font-size:.76rem;width:100%;display:flex;align-items:flex-start;gap:.5rem">'+
              '<i class="fas '+(im[n.type]||'fa-circle')+'" style="font-size:.75rem;color:rgba(255,255,255,.5);margin-top:2px"></i>'+
              '<div style="flex:1">'+
                '<div style="font-weight:600;color:rgba(255,255,255,.88)">'+(n.label||n.id)+(n.auto?' <span style="font-size:.6rem;background:rgba(244,179,91,.2);color:#fbbf24;padding:.1rem .3rem;border-radius:4px">AUTO</span>':'')+'</div>'+
                (n.role?'<div style="font-size:.67rem;color:rgba(255,255,255,.38)">'+n.role.replace(/_/g,' ')+(n.sla_hours?' \u00b7 SLA '+n.sla_hours+'h':'')+'</div>':'')+
                (n.description?'<div style="font-size:.64rem;color:rgba(255,255,255,.28);margin-top:.12rem">'+n.description.slice(0,110)+(n.description.length>110?'\u2026':'')+'</div>':'')+
              '</div>'+
            '</div>'+
          '</div>';
        }).join('');
      }
      continue;
    }
  }
}


async function sendAiChat(productId) {
  const input = document.getElementById('aiChatInput');
  const msg = input ? input.value.trim() : '';
  if (!msg) return;
  appendChatBubble('user', msg);
  if (input) input.value = '';
  const btn = document.getElementById('aiChatSendBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>'; }

  // Add a "thinking" placeholder we will remove on response
  const thinkEl = appendChatBubble('assistant',
    '<span style="opacity:.5"><i class="fas fa-circle-notch fa-spin" style="margin-right:6px;font-size:.75rem"></i>Thinking…</span>');

  try {
    const u = currentUser();
    const chatBody = { message: msg, thread_id: aiThreadId, user_id: u.id, user_name: u.name };
    if (productId) chatBody.product_id = productId;
    else chatBody.context = { purpose: 'product_creation' };
    const r = await fetch('/api/v1/ai/products/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(chatBody)
    });
    const d = await r.json();

    // Remove thinking bubble
    if (thinkEl && thinkEl.parentNode) thinkEl.parentNode.removeChild(thinkEl);

    if (d.thread_id) aiThreadId = d.thread_id;

    // ── Infer stage from message text as a client-side safety net ─────────
    // GPT sometimes returns current_stage:1 even for Stage 2/3 sub-questions.
    // Use a layered approach: start from d.current_stage, then improve it from
    // message content, then apply the monotonic guard.
    const msgText = (d.reply || d.message || '').toLowerCase();
    let inferredStage = d.current_stage || 0;

    // 1. Explicit "Stage N" markers — "stage 2 —", "stage 3:", etc.
    const stageMatch = msgText.match(/stage\s+([2-6])[\s\u2014:–\-]/g);
    if (stageMatch) {
      stageMatch.forEach(m => {
        const n = parseInt(m.replace(/\D/g, ''));
        if (n > inferredStage) inferredStage = n;
      });
    }

    // 2. "Stage N complete" → next stage is starting; bump inferred to N+1
    const completeMatch = msgText.match(/stage\s+(\d+)\s+complete/i);
    if (completeMatch) {
      const completedN = parseInt(completeMatch[1]);
      if (completedN + 1 > inferredStage) inferredStage = completedN + 1;

      // ── Stage 1 complete: seed draft card with product name from message ──
      // GPT sometimes skips set_field on the Stage 1→2 transition message.
      // Extract the confirmed name from the message text (original case) as a
      // fallback so the draft card appears immediately rather than waiting for
      // the first explicit set_field event.
      if (completedN === 1 && !aiDraftConfig.name) {
        const rawMsg = d.reply || d.message || '';
        // Strip HTML tags so <strong>Stage 1 complete.</strong> becomes plain text
        const plainMsg = rawMsg.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
        // Pattern 1: "Stage 1 complete — ProductName, conventional..."
        const nameMatch = plainMsg.match(/[Ss]tage\s+1\s+complete[^—–\-]*[—–\-]\s*([^,\n]{4,60?}),/i)
          // Pattern 2: quoted name anywhere in message  "ProductName"
          || plainMsg.match(/"([^"]{4,60})"/);
        if (nameMatch) {
          const extracted = nameMatch[1].trim().replace(/[.!]$/, '');
          // Sanity check: has uppercase, ≤8 words (product name, not a sentence)
          if (/[A-Z]/.test(extracted) && extracted.split(' ').length <= 8) {
            aiDraftConfig.name = extracted;
            setTimeout(() => updateAiDraftCard(), 200);
          }
        }
      }

      // ── Stage 2 complete: seed missing config fields from message text ──
      // GPT sometimes skips individual set_field events across Stage 2 sub-questions.
      // When Stage 2 complete fires, the message text contains the full summary:
      // "Rate 5.25% · Green discount 0.75%/0.5% · LTV 90/80% · DBR 55% · OMR 25K–500K · Term 25yr max"
      // Extract and seed any fields still missing from aiDraftConfig.
      if (completedN === 2) {
        const rawMsg = d.reply || d.message || '';
        const plain2 = rawMsg.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
        // base_rate
        if (!aiDraftConfig.base_rate) {
          const m = plain2.match(/rate\s*[\:·]?\s*(\d+\.\d+)%/i) || plain2.match(/(\d+\.\d+)%\s*·/);
          if (m) aiDraftConfig.base_rate = parseFloat(m[1]);
        }
        // green_discount_premium (first % after "discount")
        if (!aiDraftConfig.green_discount_premium) {
          const m = plain2.match(/discount[^0-9]*(\d+\.\d+)%/i);
          if (m) aiDraftConfig.green_discount_premium = parseFloat(m[1]);
        }
        // max_ltv
        if (!aiDraftConfig.max_ltv) {
          const m = plain2.match(/ltv\s*[\:·]?\s*(\d+)%/i);
          if (m) aiDraftConfig.max_ltv = parseInt(m[1]);
        }
        // max_dbr
        if (!aiDraftConfig.max_dbr) {
          const m = plain2.match(/dbr\s*[\:·]?\s*(\d+)%/i);
          if (m) aiDraftConfig.max_dbr = parseInt(m[1]);
        }
        // max_amount (look for OMR 25K–500K or OMR 25,000–500,000)
        if (!aiDraftConfig.max_amount) {
          const m = plain2.match(/omr\s*[\d,]+[\s–\-]+(\d[\d,]+)/i) || plain2.match(/–\s*omr\s*([\d,]+)/i) || plain2.match(/(\d{3},\d{3})/);
          if (m) { const v = parseInt(m[1].replace(/,/g,'')); if (v >= 10000) aiDraftConfig.max_amount = v; }
        }
        // min_amount
        if (!aiDraftConfig.min_amount) {
          const m = plain2.match(/omr\s*([\d,]+)\s*[–\-]/i);
          if (m) { const v = parseInt(m[1].replace(/,/g,'')); if (v >= 1000 && v <= 100000) aiDraftConfig.min_amount = v; }
        }
        // max_term (look for "25yr" or "25 years" or "Term 25")
        if (!aiDraftConfig.max_term) {
          const m = plain2.match(/(?:term|terms?)\s*(?:max|:)?\s*(\d+)\s*yr/i) || plain2.match(/(\d+)\s*yr\s*max/i);
          if (m) { const v = parseInt(m[1]); if (v >= 5 && v <= 35) aiDraftConfig.max_term = v; }
        }
        if (!aiDraftConfig.min_term) aiDraftConfig.min_term = 3;
        setTimeout(() => updateAiDraftCard(), 250);
      }

      // ── Stage 5 complete: seed compliance summary fields ──────────────────
      if (completedN === 5) {
        const rawMsg = d.reply || d.message || '';
        const plain5 = rawMsg.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
        if (!aiDraftConfig._compliance) {
          // Extract risk weight
          const rw = plain5.match(/(\d+)%\s*(?:risk weight|capital)/i);
          // Extract provisioning / IFRS9
          const prov = plain5.match(/(\d+\.\d+)%\s*(?:stage 1|provisioning|ecl)/i);
          // Extract AML
          const aml = /aml\s*(?:risk|score)?\s*(?:is|=|:)?\s*(low|medium|high)/i.exec(plain5);
          aiDraftConfig._compliance = {
            risk_weight: rw ? rw[1] + '%' : '75%',
            provisioning: prov ? prov[1] + '%' : '1.5%',
            aml: aml ? aml[1].toUpperCase() : 'LOW',
            classification: plain5.toLowerCase().includes('green finance') ? 'Green Finance' : 'Standard',
          };
          setTimeout(() => updateAiDraftCard(), 250);
        }
      }

      // Pulse draft card border to signal stage completion to the user
      setTimeout(_pulseDraftBorder, 600);
    }

    // 3. Stage 2 keyword fingerprints — if any Stage 2-specific terms appear
    //    in the message, it's at least Stage 2 (even if GPT said current_stage:1)
    const stage2Keywords = ['base rate', '5.25%', 'ltv', 'dbr', 'debt burden', 'green discount',
      'gsas score band', 'arrangement fee', 'early settlement', 'term range', 'amount range',
      'discount tier', 'loan-to-value', 'pricing structure'];
    if (inferredStage < 2 && stage2Keywords.some(kw => msgText.includes(kw))) inferredStage = 2;

    // 4. Stage 3 fingerprints
    const stage3Keywords = ['eligibility rules', 'add_rule', 'credit score ≥', 'dbr ≤', 'gsas minimum',
      'collateral rules', 'esg rules', 'income/employment', 'credit rules', 'r1:', 'r2:'];
    if (inferredStage < 3 && stage3Keywords.some(kw => msgText.includes(kw))) inferredStage = 3;

    // 5. Stage 4 fingerprints
    if (inferredStage < 4 && (msgText.includes('approval workflow') || msgText.includes('set_workflow') ||
        msgText.includes('ekyc') || (msgText.includes('workflow') && msgText.includes('steps')))) inferredStage = 4;

    // 6. Stage 5 fingerprints
    if (inferredStage < 5 && (msgText.includes('compliance') && (msgText.includes('basel iii') ||
        msgText.includes('ifrs') || msgText.includes('aml risk')))) inferredStage = 5;

    // Monotonic guard — stage can only advance, never go back
    const newStage = Math.max(inferredStage, aiCurrentStage);

    // ── Roadmap: always render when we have a stage, so strip stays in sync ─
    if (newStage > 0) {
      renderRoadmap(newStage);
    }

    // ── Proactive draft card creation ─────────────────────────────────────
    // Ensure the draft card shell exists as soon as Stage 2+ is reached,
    // even if GPT hasn't emitted a set_field yet. This makes the card
    // visible immediately on the Stage 1→2 transition turn.
    if (newStage >= 2 && !document.getElementById('ai-draft-card')) {
      setTimeout(() => updateAiDraftCard(), 100);
    }

    // ── Build reply HTML ──────────────────────────────────────────────────
    let replyHtml = markdownToHtml(d.reply || d.message || 'Done.');

    if (d.product_draft) {
      aiProductDraft = d.product_draft;
      replyHtml += '<div style="margin-top:8px;padding:8px 10px;background:rgba(22,132,91,.15);border:1px solid rgba(22,132,91,.3);border-radius:6px;font-size:.78rem">'
        + '<strong><i class="fas fa-file-alt" style="margin-right:5px"></i>Product Draft</strong><br>'
        + '<b>' + (d.product_draft.name || '') + '</b> &middot; '
        + (d.product_draft.base_rate || '') + '% &middot; up to OMR '
        + Number(d.product_draft.max_amount || 0).toLocaleString()
        + '</div>';
    }
    if (d.rules_draft && d.rules_draft.length) {
      replyHtml += '<div style="margin-top:8px;padding:8px 10px;background:rgba(0,127,134,.12);border:1px solid rgba(0,127,134,.3);border-radius:6px;font-size:.78rem">'
        + '<strong><i class="fas fa-list-check" style="margin-right:5px"></i>Rules (' + d.rules_draft.length + ')</strong><br>'
        + d.rules_draft.map(x => '&bull; ' + (x.name || x.metric || 'rule')).join('<br>')
        + '</div>';
    }
    if (d.schema_draft) {
      replyHtml += '<div style="margin-top:8px;padding:8px 10px;background:rgba(244,179,91,.1);border:1px solid rgba(244,179,91,.3);border-radius:6px;font-size:.78rem">'
        + '<strong><i class="fas fa-code" style="margin-right:5px"></i>GSAS Schema</strong> &mdash; '
        + (d.schema_draft.fields ? d.schema_draft.fields.length : Object.keys(d.schema_draft).length)
        + ' fields defined</div>';
    }

    appendChatBubble('assistant', replyHtml);

    // ── Dispatch UI events — always fire, even in standalone mode ────────
    // set_field events update the live draft card even without a product panel.
    // set_tab / add_rule / set_workflow also work when product panel is open.
    const dispatchTarget = productId || aiProductIdContext;

    // Safety: if stage 4+ and GPT response includes no set_workflow event,
    // but rules_draft was returned in a prior turn, the draft card should still
    // show a workflow step count badge. We detect stage ≥4 and if ai_events
    // contains no set_workflow, we force-update the draft card so wCount badge
    // reflects the aiDraftWorkflow already accumulated (nothing to inject here —
    // handled below after dispatch). Also handle rules from rules_draft inline display.
    const eventsToDispatch = (d.ui_events && d.ui_events.length) ? [...d.ui_events] : [];

    // If stage ≥4 reached and no set_workflow ui_event was sent by GPT,
    // re-render draft card anyway so expand button reflects wCount
    const hasSetWorkflow = eventsToDispatch.some(ev => ev.type === 'set_workflow');
    if (d.current_stage >= 4 && !hasSetWorkflow && aiDraftWorkflow.length > 0) {
      setTimeout(() => updateAiDraftCard(), 400);
    }

    if (eventsToDispatch.length) {
      setTimeout(() => dispatchUiEvents(eventsToDispatch, dispatchTarget || null), 350);
    }

    // ── Show confirm bar ──────────────────────────────────────────────────
    if (d.action === 'ready_to_confirm' || d.action === 'show_draft' ||
        (aiProductDraft && d.action !== 'none')) {
      const bar = document.getElementById('ai-confirm-bar');
      if (bar) bar.style.display = 'flex';
    }

  } catch(e) {
    if (thinkEl && thinkEl.parentNode) thinkEl.parentNode.removeChild(thinkEl);
    appendChatBubble('assistant', '<span style="color:#f87171"><i class="fas fa-exclamation-circle" style="margin-right:5px"></i>Error: ' + e.message + '</span>');
  }
  if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i>'; }
}

async function confirmAiProduct(productId) {
  if (!aiThreadId && !aiProductDraft) { toast('No product draft to confirm','error'); return; }
  const btn = document.querySelector('#ai-confirm-bar .btn-success');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Saving…'; }
  try {
    // Send both thread_id AND any locally-held draft as a safety fallback.
    // The backend prefers the thread's saved result, but will use the body draft
    // if the thread result is missing (e.g. if a prior turn wiped it).
    const body = { thread_id: aiThreadId, user_id: currentUserId() };
    if (productId) body.product_id = productId;
    if (aiProductDraft) body.product_draft = aiProductDraft;
    // Also send locally-accumulated rules and schema as a fallback —
    // backend prefers thread result but uses these if thread is missing them.
    if (aiDraftRules && aiDraftRules.length) body.rules_draft = aiDraftRules;
    const r = await fetch('/api/v1/ai/products/confirm', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.success || d.product_id) {
      const newId = d.product_id || productId;
      toast('✅ Product published! Now live.', 'success');
      // Show success with direct PGE link — keep panel open so user can see it
      appendChatBubble('assistant',
        '<strong style="color:#4ade80">✅ Product published!</strong><br><br>' +
        '<strong>' + (d.product_name || 'Green Home Loan') + '</strong> is now live.<br>' +
        (d.rule_ids && d.rule_ids.length ? '<span style="color:rgba(255,255,255,.55);font-size:.78rem">✓ ' + d.rule_ids.length + ' eligibility rules saved</span><br>' : '') +
        '<div style="display:flex;gap:.5rem;margin-top:.65rem;flex-wrap:wrap">' +
        (newId ? '<a href="/portals/product-config.html?id=' + newId + '" style="display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .85rem;background:rgba(53,198,196,.18);color:var(--sea-glass);border:1px solid rgba(53,198,196,.4);border-radius:6px;font-size:.78rem;font-weight:600;text-decoration:none" target="_blank"><i class="fas fa-wand-magic-sparkles"></i> Open in PGE</a>' : '') +
        '</div>' +
        '<br><small style="opacity:.4">Customer portal updated. Go to Products tab to see the new card.</small>'
      );
      const bar = document.getElementById('ai-confirm-bar');
      if (bar) bar.style.display = 'none';
      aiThreadId = null; aiProductDraft = null;
      // Refresh product list in background; don't close panel — user sees the PGE link
      await loadProducts();
      await renderProducts();
    } else { toast(d.error||'Confirm failed', 'error'); }
  } catch(e) { toast(e.message, 'error'); }
  if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-rocket"></i> Confirm &amp; Publish'; }
}

            </tr>
          </thead>
          <tbody>
            ${products.map(p => {
              const mandatoryTags = tags.filter(t=>t.severity==='mandatory');
              const covered = mandatoryTags.filter(t => productTagMap[t.id]?.has(p.id)).length;
              const pct = mandatoryTags.length > 0 ? Math.round((covered/mandatoryTags.length)*100) : 100;
              return `
              <tr style="border-bottom:1px solid var(--grey-100)">
                <td style="padding:.5rem .75rem;font-weight:500;color:var(--navy)">${p.name}</td>
                ${mandatoryTags.map(t => {

                  <span style="font-weight:700;font-size:.8rem;color:${pct>=80?'var(--success)':pct>=50?'var(--amber)':'var(--danger)'}">${pct}%</span>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

let _rulesFilterProduct = null; // null = global CBO rules only
async function renderRules(filterProductId) {
  if (filterProductId !== undefined) _rulesFilterProduct = filterProductId;
  const showingProduct = _rulesFilterProduct;

  document.getElementById('pageTitle').textContent = 'Rules Engine';

  // Fetch global rules + product-specific rules
  let globalRules = [], productRules = [];
  try {
    const gr = await fetch('/api/v1/rules');
    const gd = await gr.json();
    globalRules = (gd.rules || []).filter(r => !r.product_id);
  } catch(e) { globalRules = []; }

  if (showingProduct) {
    try {
      const pr = await fetch(`/api/v1/rules?product_id=${showingProduct}`);
      const pd = await pr.json();
      productRules = (pd.rules || []).filter(r => r.product_id === showingProduct);
    } catch(e) { productRules = []; }
  }

  rules = [...globalRules, ...productRules];
  const activeCount = rules.filter(r => r.is_active).length;
  const productLabel = showingProduct ? (products.find(p=>p.id===showingProduct)?.name || showingProduct) : null;
  document.getElementById('pageSubtitle').textContent = showingProduct
    ? `${globalRules.filter(r=>r.is_active).length} CBO global + ${productRules.filter(r=>r.is_active).length} product-specific rules`
    : `${activeCount} CBO global regulatory rules`;

  const catColors = { creditworthiness:'rule-cat-creditworthiness', collateral:'rule-cat-collateral', esg:'rule-cat-esg', compliance:'rule-cat-compliance', stress_test:'rule-cat-stress_test', product:'rule-cat-product', eligibility:'rule-cat-eligibility' };

  function ruleRows(ruleList, showOrigin) {
    if (!ruleList.length) return '<p style="color:var(--grey-400);font-size:.83rem;padding:.75rem;font-style:italic">No rules in this section.</p>';
    return ruleList.map(r => `
    <div style="display:grid;grid-template-columns:2.5fr 1.1fr 1.6fr 2fr .9fr;padding:.625rem .75rem;font-size:.82rem;border-bottom:1px solid var(--grey-100);align-items:center" class="${r.source==='ai_generated'?'ai-row':''}">
      <div>
        <span style="font-weight:500;color:var(--navy)">${r.name}</span>
        ${showOrigin && r.product_id ? `<span style="margin-left:.4rem;font-size:.67rem;padding:.1rem .4rem;border-radius:4px;background:rgba(0,127,134,.1);color:var(--teal);font-weight:600">PRODUCT</span>` : ''}
        ${r.source==='ai_generated'?'<span class="ai-confidence-tag"><i class="fas fa-robot"></i> AI ${r.ai_confidence||94}%</span>':''}
      </div>
      <span class="rule-category-tag ${catColors[r.category]||''}">${r.category}</span>
      <code style="font-size:.75rem;color:var(--teal)">${r.metric} ${r.operator} ${r.threshold_value??r.threshold_condition??'–'}</code>
      <span style="font-size:.75rem;color:var(--grey-500)">${r.regulatory_reference||'–'}</span>
      <span class="badge ${r.severity==='hard'?'badge-red':'badge-amber'}">${r.severity||'hard'}</span>
    </div>`).join('');
  }

  const productSelector = `<select class="form-control" style="width:220px;font-size:.82rem;padding:.3rem .6rem" onchange="renderRules(this.value||null)">
    <option value="">CBO Global Rules only</option>
    ${products.map(p=>`<option value="${p.id}" ${p.id===showingProduct?'selected':''}>${p.name}</option>`).join('')}
  </select>`;

  document.getElementById('mainContent').innerHTML = `<div class="page">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">
      <div>
        <h2>Rules Engine</h2>
        <p>CBO-compliant regulatory rules library${productLabel ? ` · filtered for <strong>${productLabel}</strong>` : ''}</p>
      </div>
      <div style="display:flex;gap:.5rem;align-items:center">
        ${productSelector}
        <button class="btn btn-navy" onclick="toast('Open AI Assistant to generate new rules from regulatory text','info')"><i class="fas fa-robot"></i> Generate from Regulatory Text</button>
      </div>
    </div>

    <!-- Stats bar -->
    <div class="metric-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:1.5rem">
      <div class="metric-card"><div class="metric-value">${globalRules.filter(r=>r.is_active).length}</div><div class="metric-label">CBO Global Rules</div></div>
      <div class="metric-card"><div class="metric-value">${showingProduct ? productRules.filter(r=>r.is_active).length : '—'}</div><div class="metric-label">Product-Specific Rules</div></div>
      <div class="metric-card"><div class="metric-value">${globalRules.filter(r=>r.severity==='hard').length}</div><div class="metric-label">Hard Constraints</div></div>
      <div class="metric-card"><div class="metric-value">${globalRules.filter(r=>r.source==='ai_generated').length}</div><div class="metric-label">AI-Generated</div></div>
    </div>

    <!-- Global Rules Section -->
    <div class="card" style="margin-bottom:1.5rem">
      <div class="card-header" style="background:var(--navy);color:white">
        <h4 style="color:white"><i class="fas fa-gavel"></i> CBO Global Rules <span style="font-size:.8rem;font-weight:400;opacity:.7;margin-left:.5rem">(applies to all products)</span></h4>
        <div class="search-bar" style="width:180px;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)">
          <i class="fas fa-search" style="color:rgba(255,255,255,.5)"></i>
          <input type="text" placeholder="Search rules…" style="color:white;background:transparent" oninput="filterRulesTable(this.value,'globalRulesTable')">
        </div>
      </div>
      <div id="globalRulesTable">
        <div style="display:grid;grid-template-columns:2.5fr 1.1fr 1.6fr 2fr .9fr;padding:.5rem .75rem;font-size:.7rem;font-weight:600;color:var(--grey-500);text-transform:uppercase;background:var(--grey-100);border-bottom:1px solid var(--grey-200)">
          <span>Rule Name</span><span>Category</span><span>Condition</span><span>Regulatory Reference</span><span>Severity</span>
        </div>
        ${ruleRows(globalRules, false)}
      </div>
    </div>

    <!-- Product-Specific Rules Section -->
    ${showingProduct ? `
    <div class="card">
      <div class="card-header" style="background:linear-gradient(135deg,var(--teal-dark,#006b72),var(--teal));color:white">
        <h4 style="color:white"><i class="fas fa-cube"></i> ${productLabel} — Product Rules <span style="font-size:.8rem;font-weight:400;opacity:.7;margin-left:.5rem">(product-specific overrides)</span></h4>
        <span style="font-size:.78rem;opacity:.7">${productRules.length} rules</span>
      </div>
      <div id="productRulesTable">
        <div style="display:grid;grid-template-columns:2.5fr 1.1fr 1.6fr 2fr .9fr;padding:.5rem .75rem;font-size:.7rem;font-weight:600;color:var(--grey-500);text-transform:uppercase;background:var(--grey-100);border-bottom:1px solid var(--grey-200)">
          <span>Rule Name</span><span>Category</span><span>Condition</span><span>Regulatory Reference</span><span>Severity</span>
        </div>
        ${ruleRows(productRules, true)}
      </div>
    </div>` : `
    <div style="background:var(--grey-50);border:1px dashed var(--grey-300);border-radius:var(--radius-md);padding:1.25rem;text-align:center;color:var(--grey-500);font-size:.85rem">
      <i class="fas fa-cube" style="margin-right:.4rem"></i> Select a product from the dropdown above to also show its product-specific rules.
    </div>`}
  </div>`;
}

function filterRulesTable(q, tableId) {
  const lq = q.toLowerCase();
  const table = document.getElementById(tableId);
  if (!table) return;
  table.querySelectorAll('div[style*="grid-template-columns"]').forEach((row, i) => {
    if (i === 0) return; // skip header
    row.style.display = (row.textContent.toLowerCase().includes(lq)) ? '' : 'none';
  });
}

async function saveProductChanges(id) {
  const get = (eid) => { const el = document.getElementById(eid); return el ? el.value : null; };
  const payload = { user_id: 'u001', user_name: 'Fatima Al-Rashdi' };
  const fields = {
    name: get('pName'), description: get('pDesc'),
    min_term: get('pMinTerm') ? parseInt(get('pMinTerm')) : null,
    max_term: get('pMaxTerm') ? parseInt(get('pMaxTerm')) : null,
    min_amount: get('pMinAmount') ? parseInt(get('pMinAmount')) : null,
    max_amount: get('pMaxAmount') ? parseInt(get('pMaxAmount')) : null,
    base_rate: get('pRate') ? parseFloat(get('pRate')) : null,
    max_dbr: get('pMaxDbr') ? parseFloat(get('pMaxDbr')) : null,
    max_ltv: get('pMaxLtv') ? parseFloat(get('pMaxLtv')) : null,
    green_dbr: get('pGreenDbr') ? parseFloat(get('pGreenDbr')) : null,
    gsas_min_score: get('pGsasMin') ? parseInt(get('pGsasMin')) : null,
    gsas_premium_score: get('pGsasPremium') ? parseInt(get('pGsasPremium')) : null,
    green_discount_standard: get('pGreenDiscStd') ? parseFloat(get('pGreenDiscStd')) : null,
    green_discount_premium: get('pGreenDiscPrem') ? parseFloat(get('pGreenDiscPrem')) : null,
  };
  // Only include non-null changed fields
  for (const [k,v] of Object.entries(fields)) { if (v !== null && v !== '') payload[k] = v; }
  try {
    const r = await fetch(`/api/v1/products/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const d = await r.json();
    if (d.success) {
      toast('Changes saved successfully', 'success');
      await loadProducts();
      await openProductDetail(id);
    } else { toast(d.error||'Save failed', 'error'); }
  } catch(e) { toast('Save failed: ' + e.message, 'error'); }
}

/* ======================== PANEL / MODAL HELPERS ======================== */
function openPanel(title, opts={}) {
  document.getElementById('panelTitle').textContent = title;
  document.getElementById('panelOverlay').classList.add('open');
  const sp = document.getElementById('slidePanel');
  if (opts.narrow) sp.classList.add('narrow'); else sp.classList.remove('narrow');
  sp.classList.add('open');
}
function closePanel() {
  document.getElementById('panelOverlay').classList.remove('open');
  const sp = document.getElementById('slidePanel');
  sp.classList.remove('open');
  sp.classList.remove('narrow');
}
function showModal(title, body, onConfirm, opts={}) {
  const confirmLabel = opts.confirmLabel || 'Confirm';
  const mc = document.getElementById('modalContainer');
  mc.innerHTML = `<div class="modal-overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><h3>${title}</h3><button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-navy" id="modalConfirmBtn">${confirmLabel}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modalConfirmBtn').onclick = onConfirm;
}
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }
function toast(msg, type='info') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle'}"></i> ${msg}`;
  c.appendChild(t);
  setTimeout(() => t.remove(), 4500);
}
