/* ======================== MARKDOWN RENDERER ======================== */
function markdownToHtml(text) {
  return text
    // Bold **text** or __text__
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/__(.+?)__/g, '<strong>$1</strong>')
    // Italic *text*
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    // Numbered list: lines starting with "1. " etc → wrap whole block
    .replace(/((?:^|\n)\d+\.\s.+)+/g, function(block) {
      const items = block.trim().split(/\n/).map(l => l.replace(/^\d+\.\s+/, ''));
      return '<ol style="margin:.5rem 0 .5rem 1.2rem;line-height:1.9">' + items.map(i => '<li>' + i + '</li>').join('') + '</ol>';
    })
    // Bullet list: lines starting with "- " or "• "
    .replace(/((?:^|\n)[\-•]\s.+)+/g, function(block) {
      const items = block.trim().split(/\n/).map(l => l.replace(/^[\-•]\s+/, ''));
      return '<ul style="margin:.5rem 0 .5rem 1.2rem;line-height:1.9">' + items.map(i => '<li>' + i + '</li>').join('') + '</ul>';
    })
    // Line breaks
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

/* ======================== INIT ======================== */
window.onload = async () => {
  await Promise.all([ loadUsers(), loadMarket() ]);
  renderSidebar();
  renderMarketBadge();
  updateUserBadge();
  await loadProducts();
  renderPage('products');
};

async function loadUsers() {
  try {
    const r = await fetch('/api/v1/users');
    const d = await r.json();
    USERS = {};
    (d.users || []).forEach(u => { USERS[u.id] = u; });
  } catch(e) {
    // Fallback defaults if API fails
    USERS = {
      u001: { id:'u001', name:'Fatima Al-Rashdi',  name_ar:'فاطمة الراشدي',  department:'Product Management', avatar_initials:'FA', role:'product_manager' },
      u002: { id:'u002', name:'Aisha Al-Balushi',  name_ar:'عائشة البلوشي',  department:'Compliance & ESG',   avatar_initials:'AB', role:'compliance_officer' },
      u003: { id:'u003', name:'Omar Al-Mantheri',  name_ar:'عمر المنذري',    department:'Credit Risk',         avatar_initials:'OM', role:'risk_officer' },
      u004: { id:'u004', name:'Khalid Al-Rawahi',  name_ar:'خالد الرواحي',   department:'Operations',          avatar_initials:'KR', role:'operations' },
    };
  }
}

async function loadMarket() {
  try {
    const r = await fetch('/api/v1/markets/default/current');
    const d = await r.json();
    activeMarket = d.market || null;
  } catch(e) {
    activeMarket = { id:'mkt001', name:'Oman', name_ar:'عُمان', currency_code:'OMR',
      currency_symbol:'ر.ع.', regulator_name:'CBO', country_code:'OM' };
  }
}

function renderMarketBadge() {
  const badge = document.getElementById('marketBadge');
  if (!badge || !activeMarket) return;
  const isAr = currentLang === 'ar';
  const name = isAr ? (activeMarket.name_ar || activeMarket.name) : activeMarket.name;
  badge.innerHTML = `<span style="font-size:1rem;margin-right:.25rem">${getFlagEmoji(activeMarket.country_code)}</span>
    <span style="font-weight:600">${name}</span>
    <span style="color:var(--grey-400);margin:0 .25rem">·</span>
    <span>${activeMarket.currency_code}</span>
    <span style="color:var(--grey-400);margin:0 .25rem">·</span>
    <span>${activeMarket.regulator_name}</span>`;
}

function getFlagEmoji(countryCode) {
  if (!countryCode || countryCode.length !== 2) return '🏳';
  return countryCode.toUpperCase().split('').map(c =>
    String.fromCodePoint(0x1F1E6 + c.charCodeAt(0) - 65)
  ).join('');
}

function updateUserBadge() {
  const u = currentUser();
  const el = document.getElementById('userAvatar');
  const nameEl = document.getElementById('userName');
  const roleEl = document.getElementById('userRole');
  if (el) el.textContent = u.avatar_initials || u.name?.charAt(0) || '?';
  if (nameEl) nameEl.textContent = currentLang === 'ar' ? (u.name_ar || u.name) : u.name;
  if (roleEl) roleEl.textContent = u.department || currentRole.replace(/_/g,' ');
}

const ROLE_BTN_ID = {
  product_manager: 'role-pm',
  compliance_officer: 'role-co',
  risk_officer: 'role-ro',
  operations: 'role-ops'
};

function switchRole(role) {
  currentRole = role;
  document.querySelectorAll('.portal-switch-btn').forEach(b => b.classList.remove('active'));
  const btnId = ROLE_BTN_ID[role];
  if (btnId) document.getElementById(btnId)?.classList.add('active');
  updateUserBadge();
  renderSidebar();
  const firstNav = ROLES[role].nav[0];
  renderPage(firstNav);
}

function setLang(lang) {
  currentLang = lang;
  const isAr = lang === 'ar';
  document.body.style.direction = isAr ? 'rtl' : 'ltr';
  document.documentElement.setAttribute('dir', isAr ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', isAr ? 'ar' : 'en');
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent.trim()===(isAr?'ع':'EN')));
  // Update all data-en/data-ar text nodes
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = isAr ? (el.getAttribute('data-ar') || el.getAttribute('data-en')) : el.getAttribute('data-en');
  });
  renderSidebar();
  renderMarketBadge();
  updateUserBadge();
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  const items = ROLES[currentRole].nav;
  nav.innerHTML = items.map(key => {
    const item = NAV_ITEMS[key];
    return `<div class="sidebar-item" onclick="renderPage('${key}')" id="nav-${key}">
      <i class="fas ${item.icon}"></i>
      <span>${currentLang==='ar' ? item.labelAr : item.label}</span>
    </div>`;
  }).join('');
}

function setActiveNav(key) {
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-'+key)?.classList.add('active');
}

/* ======================== PAGE ROUTER ======================== */

  setActiveNav(page);
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="page"><div class="empty-state"><i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--grey-300)"></i></div></div>';
  
  switch(page) {
    case 'products': await loadProducts(); await renderProducts(); break;
    case 'rules': await renderRules(); break;
    case 'audit_logs': await renderAuditLogs(); break;
    case 'tasks': await renderComplianceTasks(); break;
    case 'esg_review': await renderEsgReview(); break;
    case 'credit_review': await renderCreditReview(); break;
    case 'escrow': await renderEscrow(); break;
    case 'regulatory_reports': await renderReports(); break;
    default: {
      const pageLabel = NAV_ITEMS[page] ? (currentLang==='ar' ? NAV_ITEMS[page].labelAr : NAV_ITEMS[page].label) : page.replace(/_/g,' ');
      document.getElementById('pageTitle').textContent = pageLabel;
      document.getElementById('pageSubtitle').textContent = '';
      main.innerHTML = renderEmptySection(page, pageLabel);
    }
  }
}

/* ======================== PRODUCTS PAGE ======================== */
async function loadProducts() {
  try {
    const r = await fetch('/api/v1/products');
    const d = await r.json();
    products = d.products || [];
  } catch(e) { products = []; }
}

async function renderProducts() {
  document.getElementById('pageTitle').textContent = 'Products';
  document.getElementById('pageSubtitle').textContent = '';

  const statusColor = {active:'badge-active', draft:'badge-draft', archived:'badge-archived'};
  const catMeta = {
    home_loan:     { icon:'fa-house',         label:'Home Loans',     color:'#007F86' },
    auto_loan:     { icon:'fa-car',            label:'Auto Finance',   color:'#35C6C4' },
    personal_loan: { icon:'fa-user',           label:'Personal Loans', color:'#F4B35B' },
    sme:           { icon:'fa-briefcase',      label:'SME Finance',    color:'#003B5C' },
    commercial:    { icon:'fa-building',       label:'Commercial',     color:'#6c757d' },
    education:     { icon:'fa-graduation-cap', label:'Education',      color:'#a855f7' },
  };
  const catOrder = ['home_loan','auto_loan','personal_loan','sme','commercial','education'];
  const groups = {};
  for (const cat of catOrder) groups[cat] = [];
  for (const p of products) {
    if (!groups[p.category]) groups[p.category] = [];
    groups[p.category].push(p);
  }

  const STAGE_LABELS = ['','Model','Config','Rules','Workflow','Comply','Sim'];
  const productCard = p => {
    const meta = catMeta[p.category] || {icon:'fa-file', label:p.category, color:'#aaa'};
    const isEsg = p.esg_required_docs && p.esg_required_docs !== '[]';
    const isAr = currentLang === 'ar';
    const stage = p.pge_stage || 0;
    const stagePct = Math.round((stage / 6) * 100);
    const stageLabel = stage > 0 ? (isAr ? `المرحلة ${stage}/6` : `Stage ${stage}/6`) : (isAr ? 'لم تبدأ' : 'Not started');
    const statusLabel = isAr ? (p.status==='active'?'نشط':p.status==='draft'?'مسودة':'مؤرشف') : p.status;
    return `<div class="product-card ${isEsg?'green':''} ${p.status==='draft'?'draft-card':''}" style="cursor:pointer;position:relative">
        <div class="product-card-header" onclick="openProductDetail('${p.id}')">
          <div>
            <div class="product-card-title"><i class="fas ${meta.icon}" style="color:${meta.color};margin-right:.4rem;font-size:.8rem"></i>${p.name}</div>
            <div class="product-card-meta">${meta.label}</div>
          </div>
          <span class="badge ${statusColor[p.status]||'badge-draft'}">${statusLabel}</span>
        </div>
        ${isEsg ? `<span class="badge badge-esg" style="margin-bottom:.5rem"><i class="fas fa-leaf"></i> ${isAr?'منتج ESG':'ESG Product'}</span>` : ''}
        <p style="font-size:.78rem;color:var(--grey-500);margin:.5rem 0;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${p.description||''}</p>
        <div class="product-card-stats" onclick="openProductDetail('${p.id}')">
          <div class="product-stat"><strong>${p.base_rate||5.5}%</strong>${isAr?'السعر الأساسي':'Base Rate'}</div>
          <div class="product-stat"><strong>${(p.applications_ytd||0).toLocaleString()}</strong>${isAr?'طلبات':'Apps YTD'}</div>
          <div class="product-stat"><strong>${p.max_ltv||90}%</strong>${isAr?'الحد الأقصى LTV':'Max LTV'}</div>
        </div>
        <div style="margin-top:.75rem;padding-top:.625rem;border-top:1px solid var(--grey-100)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.35rem">
            <span style="font-size:.7rem;color:var(--grey-500);font-weight:500">${isAr?'تقدم إعداد المنتج':'PGE Configuration'}</span>
            <span style="font-size:.7rem;color:${stage===6?'var(--success)':'var(--grey-500)'};font-weight:600">${stageLabel}</span>
          </div>
          <div style="height:4px;background:var(--grey-150);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${stagePct}%;background:${stage===6?'var(--success)':stage>0?'var(--teal)':'var(--grey-300)'};border-radius:4px;transition:width .3s"></div>

function filterProducts(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('.product-card').forEach(card => {
    const name = (card.querySelector('.product-card-title')||{textContent:''}).textContent.toLowerCase();
    card.style.display = name.includes(lq) ? '' : 'none';
  });
  // Hide category section headers when all their cards are hidden
  document.querySelectorAll('#productGrid > div').forEach(section => {
    const grid = section.querySelector('.product-grid');
    if (!grid) return;
    const visible = [...grid.querySelectorAll('.product-card')].some(c => c.style.display !== 'none');
    section.style.display = visible ? '' : 'none';
  });
}

// Track which product we're editing docs for
let _docEditProductId = null;
let _docEditCurrentList = [];
let _catalogueSelectedKeys = new Set();

function openDocCatalogue(productId) {
  _docEditProductId = productId;
  _catalogueSelectedKeys = new Set();
  // Get current docs from the displayed list
  const prod = products.find(x => x.id === productId);
  _docEditCurrentList = prod ? (() => { try { return JSON.parse(prod.required_docs||'[]'); } catch{return[];} })() : [];

  // Group catalogue by category
  const groups = {};
  DOC_CATALOGUE.forEach(d => {
    if (!groups[d.group]) groups[d.group] = [];
    groups[d.group].push(d);
  });

  const alreadyAdded = new Set(_docEditCurrentList);
  let html = '';
  for (const [group, items] of Object.entries(groups)) {
    html += `<div style="font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--grey-400);letter-spacing:.06em;margin:.6rem 0 .25rem">${group}</div>`;
    items.forEach(item => {
      const already = alreadyAdded.has(item.key);
      html += `<label style="display:flex;align-items:center;gap:.5rem;padding:.35rem .5rem;border-radius:6px;cursor:${already?'not-allowed':'pointer'};background:${already?'var(--grey-50)':'white'};opacity:${already?'.5':'1'};border:1px solid transparent" ${already?'':'onmouseover="this.style.background=\'var(--grey-50)\'" onmouseout="this.style.background=\'white\'"'}>
        <input type="checkbox" value="${item.key}" ${already?'disabled checked':''}
          onchange="toggleCatalogueItem('${item.key}',this.checked)"
          style="accent-color:var(--navy)">
        <span style="font-size:.82rem;font-weight:500;color:var(--navy-dark)">${item.label}</span>
        <code style="margin-left:auto;font-size:.67rem;color:var(--grey-400)">${item.key}</code>
      </label>`;
    });
  }
  document.getElementById('catalogueItems').innerHTML = html;

  const modal = document.getElementById('docCatalogueModal');
  modal.style.display = 'flex';
}

function toggleCatalogueItem(key, checked) {
  if (checked) _catalogueSelectedKeys.add(key);
  else _catalogueSelectedKeys.delete(key);
}

function closeDocCatalogue() {
  const modal = document.getElementById('docCatalogueModal');
  if (modal) modal.style.display = 'none';
}

async function saveSelectedDocs(productId) {
  if (_catalogueSelectedKeys.size === 0) { closeDocCatalogue(); return; }
  const prod = products.find(x => x.id === productId);
  const current = prod ? (() => { try { return JSON.parse(prod.required_docs||'[]'); } catch{return[];} })() : [];
  const newList = [...current, ...[..._catalogueSelectedKeys].filter(k => !current.includes(k))];
  await patchProductDocs(productId, newList);
  closeDocCatalogue();
}

async function removeDoc(productId, docKey) {
  const prod = products.find(x => x.id === productId);
  const current = prod ? (() => { try { return JSON.parse(prod.required_docs||'[]'); } catch{return[];} })() : [];
  const newList = current.filter(k => k !== docKey);
  await patchProductDocs(productId, newList);
}

async function addManualDoc(productId) {
  const input = document.getElementById('manualDocInput');
  const raw = input ? input.value.trim() : '';
  if (!raw) return;
  // Normalise: lowercase, spaces → underscores, strip special chars
  const key = raw.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
  if (!key) { toast('Invalid document key','error'); return; }
  const prod = products.find(x => x.id === productId);
  const current = prod ? (() => { try { return JSON.parse(prod.required_docs||'[]'); } catch{return[];} })() : [];
  if (current.includes(key)) { toast('Document already in list','info'); return; }
  await patchProductDocs(productId, [...current, key]);
  if (input) input.value = '';
}

async function patchProductDocs(productId, newDocList) {
  try {
    const r = await fetch(`/api/v1/products/${productId}`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ required_docs: JSON.stringify(newDocList) })
    });
    const d = await r.json();
    if (d.success) {
      // Update local cache
      const prod = products.find(x => x.id === productId);
      if (prod) prod.required_docs = JSON.stringify(newDocList);
      toast('Documents updated', 'success');
      // Re-open the same tab to refresh display
      switchProductTab('documents', productId);
    } else { toast(d.error||'Failed to update documents','error'); }
  } catch(e) { toast(e.message,'error'); }
}

/* ======================== AI PRODUCT STUDIO (multi-turn) ======================== */
let aiThreadId = null;
let aiProductDraft = null;

function resetAiChat(productId) {
  aiThreadId = null; aiProductDraft = null;
  const log = document.getElementById('ai-chat-log');
  if (log) log.innerHTML = '';
  const bar = document.getElementById('ai-confirm-bar');
  if (bar) bar.style.display = 'none';
}

function appendChatBubble(role, html) {
  const log = document.getElementById('ai-chat-log');
  if (!log) return;
  const isUser = role === 'user';
  const el = document.createElement('div');
  el.style.cssText = 'display:flex;justify-content:' + (isUser?'flex-end':'flex-start');
  el.innerHTML = '<div style="max-width:85%;padding:9px 13px;border-radius:12px;font-size:.82rem;line-height:1.5;background:' + (isUser?'rgba(53,198,196,.2)':' rgba(255,255,255,.07)') + ';color:rgba(255,255,255,.9)">' + html + '</div>';
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

async function sendAiChat(productId) {
  const input = document.getElementById('aiChatInput');
  const msg = input ? input.value.trim() : '';
  if (!msg) return;
  appendChatBubble('user', msg);
  if (input) input.value = '';
  const btn = document.getElementById('aiChatSendBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>'; }
  appendChatBubble('assistant', 'Thinking...');
  try {
    const u = currentUser();
    const chatBody = { message: msg, thread_id: aiThreadId, user_id: u.id, user_name: u.name };
    if (productId) chatBody.product_id = productId;
    else chatBody.context = { purpose: 'product_creation' };
    const r = await fetch('/api/v1/ai/products/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(chatBody)
    });
    const d = await r.json();
    const log2 = document.getElementById('ai-chat-log');
    if (log2 && log2.lastChild) log2.removeChild(log2.lastChild);
    if (d.thread_id) aiThreadId = d.thread_id;
    let replyHtml = markdownToHtml(d.reply || d.message || 'Done.');
    if (d.product_draft) {
      aiProductDraft = d.product_draft;
      replyHtml += '<div style="margin-top:8px;padding:8px 10px;background:rgba(22,132,91,.15);border:1px solid rgba(22,132,91,.3);border-radius:6px;font-size:.78rem"><strong>Product Draft</strong><br><b>' + (d.product_draft.name||'') + '</b> &middot; ' + (d.product_draft.base_rate||'') + '% &middot; up to OMR ' + Number(d.product_draft.max_amount||0).toLocaleString() + '</div>';
    }
    if (d.rules_draft && d.rules_draft.length) {
      replyHtml += '<div style="margin-top:8px;padding:8px 10px;background:rgba(0,127,134,.12);border:1px solid rgba(0,127,134,.3);border-radius:6px;font-size:.78rem"><strong>Rules Draft (' + d.rules_draft.length + ')</strong><br>' + d.rules_draft.map(function(x){return '&bull; '+(x.name||x.metric||'rule');}).join('<br>') + '</div>';
    }
    if (d.schema_draft) {
      replyHtml += '<div style="margin-top:8px;padding:8px 10px;background:rgba(244,179,91,.1);border:1px solid rgba(244,179,91,.3);border-radius:6px;font-size:.78rem"><strong>GSAS Schema</strong> &mdash; ' + Object.keys(d.schema_draft).length + ' fields defined</div>';
    }
    appendChatBubble('assistant', replyHtml);
    // Show confirm bar when AI signals readiness — action field OR product_draft present after turn 3+
    if (d.action === 'ready_to_confirm' || d.action === 'show_draft' ||
        (aiProductDraft && d.action !== 'none')) {
      const bar = document.getElementById('ai-confirm-bar');
      if (bar) bar.style.display = 'flex';
    }
  } catch(e) {
    const log3 = document.getElementById('ai-chat-log');
    if (log3 && log3.lastChild) log3.removeChild(log3.lastChild);
    appendChatBubble('assistant', 'Error: ' + e.message);
  }
  if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i>'; }
}

async function confirmAiProduct(productId) {
  if (!aiThreadId && !aiProductDraft) { toast('No product draft to confirm','error'); return; }
  const btn = document.querySelector('#ai-confirm-bar .btn-success');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Saving…'; }
  try {
    // Send both thread_id AND any locally-held draft as a safety fallback.
    // The backend prefers the thread's saved result, but will use the body draft
    // if the thread result is missing (e.g. if a prior turn wiped it).
    const body = { thread_id: aiThreadId, user_id: currentUserId() };
    if (productId) body.product_id = productId;
    if (aiProductDraft) body.product_draft = aiProductDraft;
    const r = await fetch('/api/v1/ai/products/confirm', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.success || d.product_id) {
      const newId = d.product_id || productId;
      toast('✅ Product published! Now live on customer portal.', 'success');
      appendChatBubble('assistant', `<strong>Done!</strong> The product has been saved and published.<br><br>
        ${newId ? `<span onclick="openProductDetail('${newId}')" style="color:var(--sea);cursor:pointer;text-decoration:underline">→ Open product configuration</span>` : ''}
        <br><small style="opacity:.5">Customer portal will show it after refresh. Developer portal updated.</small>`);
      const bar = document.getElementById('ai-confirm-bar');
      if (bar) bar.style.display = 'none';
      aiThreadId = null; aiProductDraft = null;
      // Close panel, refresh products list and re-render the products page
      closePanel();
      await loadProducts();
      await renderProducts();
    } else { toast(d.error||'Confirm failed', 'error'); }
  } catch(e) { toast(e.message, 'error'); }
  if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-rocket"></i> Confirm &amp; Publish'; }
}

    method:'POST', headers:{'Content-Type':'application/json'},

async function rejectApplication(appId) {

    body: JSON.stringify({ user_id:'u002', reason:'ESG requirements not met' })
  });
  toast('Application rejected','error');
  closePanel();
  await renderComplianceTasks();
}

        <div class="card-body">
          <div class="stage-timeline">
            ${stages.length ? stages.map(stage => `
            <div class="stage-item ${stage.status}">
              <div class="stage-number ${stage.status}">${stage.status==='completed'||stage.status==='paid'?'✓':stage.stage_number}</div>
              <div class="stage-info">
                <div class="stage-name">${stage.stage_name}</div>
                <div class="stage-material"><i class="fas fa-leaf" style="color:var(--success)"></i> ${stage.required_material}</div>
                ${stage.payment_reference ? `<div style="font-size:.75rem;color:var(--teal);margin-top:.25rem"><i class="fas fa-check-circle"></i> Paid · Ref: ${stage.payment_reference}</div>` : ''}
              </div>
              <div style="text-align:right">
                <div class="stage-amount">OMR ${(stage.tranche_amount||0).toLocaleString()}</div>
                <div style="font-size:.75rem;color:var(--grey-500)">${stage.tranche_percentage||25}% of total</div>
                ${stage.status==='active' ? `<button class="btn btn-success btn-sm" style="margin-top:.5rem" onclick="releaseTranche('${stage.id}','${appId}',${stage.tranche_amount||50000})"><i class="fas fa-money-bill-transfer"></i> Release</button>` : ''}
              </div>
            </div>`).join('') : '<p style="color:var(--grey-500);text-align:center;padding:2rem">No escrow stages found for this application.</p>'}
          </div>
        </div>
      </div>
    </div>`;
  } catch(e) { document.getElementById('mainContent').innerHTML = '<div class="page"><p>Error loading escrow data</p></div>'; }
}

async function releaseTranche(stageId, appId, amount) {
  const r = await fetch(`/api/v1/escrow/${appId}/release-tranche`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ stage_id: stageId, amount, user_id:'u004', user_name:'Khalid Al-Rawahi' })
  });
  const d = await r.json();
  toast(`Payment Released: OMR ${amount.toLocaleString()} · Ref: ${d.transaction_reference||'TRX-'+Date.now()}`, 'success');
  await renderEscrow();
}

/* ======================== PRODUCT CLONE / NEW ======================== */
function showCloneModal() {
  const opts = products.filter(p=>p.status==='active').map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  showModal('Clone Product', `
    <div class="form-group"><label class="form-label">Clone from</label><select class="form-control" id="cloneSource">${opts}</select></div>
    <div class="form-group"><label class="form-label">New Product Name</label><input class="form-control" id="cloneName" value="" placeholder="New product name…"></div>
  `, async () => {
    const sourceId = document.getElementById('cloneSource').value;
    const name = document.getElementById('cloneName').value;
    if (!name) return toast('Enter a product name','error');
    const cu = currentUser();
    const r = await fetch(`/api/v1/products/clone/${sourceId}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, user_id: cu.id }) });
    const d = await r.json();
    if (d.success) { toast(`Product "${name}" cloned successfully`,'success'); await loadProducts(); await renderProducts(); closeModal(); }
  });
}

async function saveProductChanges(id) {
  const get = (eid) => { const el = document.getElementById(eid); return el ? el.value : null; };
  const payload = { user_id: 'u001', user_name: 'Fatima Al-Rashdi' };
  const fields = {
    name: get('pName'), description: get('pDesc'),
    min_term: get('pMinTerm') ? parseInt(get('pMinTerm')) : null,
    max_term: get('pMaxTerm') ? parseInt(get('pMaxTerm')) : null,
    min_amount: get('pMinAmount') ? parseInt(get('pMinAmount')) : null,
    max_amount: get('pMaxAmount') ? parseInt(get('pMaxAmount')) : null,
    base_rate: get('pRate') ? parseFloat(get('pRate')) : null,
    max_dbr: get('pMaxDbr') ? parseFloat(get('pMaxDbr')) : null,
    max_ltv: get('pMaxLtv') ? parseFloat(get('pMaxLtv')) : null,
    green_dbr: get('pGreenDbr') ? parseFloat(get('pGreenDbr')) : null,
    gsas_min_score: get('pGsasMin') ? parseInt(get('pGsasMin')) : null,
    gsas_premium_score: get('pGsasPremium') ? parseInt(get('pGsasPremium')) : null,
    green_discount_standard: get('pGreenDiscStd') ? parseFloat(get('pGreenDiscStd')) : null,
    green_discount_premium: get('pGreenDiscPrem') ? parseFloat(get('pGreenDiscPrem')) : null,
  };
  // Only include non-null changed fields
  for (const [k,v] of Object.entries(fields)) { if (v !== null && v !== '') payload[k] = v; }
  try {
    const r = await fetch(`/api/v1/products/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const d = await r.json();
    if (d.success) {
      toast('Changes saved successfully', 'success');
      await loadProducts();
      await openProductDetail(id);
    } else { toast(d.error||'Save failed', 'error'); }
  } catch(e) { toast('Save failed: ' + e.message, 'error'); }
}

async function publishProduct(id) {
  const r = await fetch(`/api/v1/products/${id}/publish`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ user_id:'u001', user_name:'Fatima Al-Rashdi' }) });
  const d = await r.json();
  if (d.success) { toast('Product published – now live!','success'); await loadProducts(); await openProductDetail(id); }
}

async function cloneProduct(id, name) {
  const newName = prompt('New product name:', name + ' (Copy)');
  if (!newName) return;
  const r = await fetch(`/api/v1/products/clone/${id}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name: newName, user_id:'u001' }) });
  const d = await r.json();
  if (d.success) { toast(`Cloned as "${newName}"`,'success'); await loadProducts(); await renderProducts(); }
}

async function saveAiConfig(productId) {
  const threshold = document.getElementById('confidenceSlider')?.value || 90;
  const u = currentUser();
  await fetch(`/api/v1/products/${productId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ai_confidence_threshold: parseInt(threshold), user_id: u.id, user_name: u.name }) });
  toast('AI configuration saved','success');
}

/* ======================== PANEL / MODAL HELPERS ======================== */
function openPanel(title) {
  document.getElementById('panelTitle').textContent = title;
  document.getElementById('panelOverlay').classList.add('open');
  document.getElementById('slidePanel').classList.add('open');
}
function closePanel() {
  document.getElementById('panelOverlay').classList.remove('open');
  document.getElementById('slidePanel').classList.remove('open');
}
function showModal(title, body, onConfirm) {
  const mc = document.getElementById('modalContainer');
  mc.innerHTML = `<div class="modal-overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><h3>${title}</h3><button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-navy" id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modalConfirmBtn').onclick = onConfirm;
}
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }
function toast(msg, type='info') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle'}"></i> ${msg}`;
  c.appendChild(t);
  setTimeout(() => t.remove(), 4500);
}
function logAuditEntry(action, entityType, entityId, detail) {
  fetch('/api/v1/audit', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action, entity_type: entityType, entity_id: entityId, details: { detail }, user_id:'u001', user_name:'Fatima Al-Rashdi', user_role:'product_manager', source:'manual' }) }).catch(()=>{});
}
