<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Management — Sohar International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;min-height:100vh;background:#060e1c;display:flex;align-items:center;justify-content:center;padding:20px}
/* full-screen background pattern */
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 20% 50%,rgba(0,127,134,.18) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 20%,rgba(201,168,76,.12) 0%,transparent 50%),
    radial-gradient(ellipse at 60% 80%,rgba(10,22,40,.8) 0%,transparent 60%);
  pointer-events:none}
.card{position:relative;z-index:1;background:rgba(255,255,255,.04);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:48px;width:100%;max-width:440px;
  box-shadow:0 30px 80px rgba(0,0,0,.5)}
.logo-area{text-align:center;margin-bottom:36px}
.logo-mark{width:64px;height:64px;background:linear-gradient(135deg,#007f86 0%,#004f55 100%);
  border-radius:18px;display:inline-flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;color:#fff;letter-spacing:-1px;
  box-shadow:0 8px 24px rgba(0,127,134,.4);margin-bottom:16px}
.logo-name{font-size:20px;font-weight:700;color:#fff;letter-spacing:.3px}
.logo-sub{font-size:12px;color:rgba(255,255,255,.35);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.portal-label{display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.2);
  color:#c9a84c;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  padding:4px 12px;border-radius:20px}
.divider-line{height:1px;background:rgba(255,255,255,.06);margin:0 0 28px}
.form-group{margin-bottom:18px}
label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:8px}
input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:13px 16px;font-size:15px;font-family:'Inter',sans-serif;
  color:#fff;outline:none;transition:border-color .2s,background .2s}
input:focus{border-color:rgba(0,127,134,.6);background:rgba(0,127,134,.06)}
input::placeholder{color:rgba(255,255,255,.2)}
.btn-login{width:100%;background:linear-gradient(135deg,#007f86 0%,#005f65 100%);
  color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600;
  cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .2s,transform .1s;
  box-shadow:0 4px 16px rgba(0,127,134,.35);margin-top:4px}
.btn-login:hover{opacity:.9}
.btn-login:active{transform:scale(.99)}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.error-msg{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.25);border-radius:8px;
  padding:11px 14px;font-size:13px;color:#f87171;margin-bottom:18px;display:none}
.roles-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:28px}
.role-tag{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  border-radius:8px;padding:8px 10px;font-size:11px;color:rgba(255,255,255,.4);text-align:center}
.role-tag strong{display:block;color:rgba(255,255,255,.65);font-size:12px;margin-bottom:2px}
.footer-note{text-align:center;font-size:11px;color:rgba(255,255,255,.2);margin-top:28px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo-area">
    <div class="logo-mark">SI</div>
    <div class="logo-name">Sohar International</div>
    <div class="logo-sub">Product Management Suite</div>
    <div class="portal-label">⚙️ Internal Staff Portal</div>
  </div>

  <div class="divider-line"></div>

  <div class="error-msg" id="errMsg" id="errText"></div>

  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="form-group">
      <label>Staff Username</label>
      <input type="text" id="loginInput" placeholder="e.g. pm01, compliance01" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="passInput" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button class="btn-login" type="submit" id="loginBtn">Sign In to Backoffice</button>
  </form>

  <div class="roles-grid">
    <div class="role-tag"><strong>pm01</strong>Product Manager</div>
    <div class="role-tag"><strong>compliance01</strong>ESG Compliance</div>
    <div class="role-tag"><strong>rm01</strong>Risk Manager</div>
    <div class="role-tag"><strong>admin</strong>System Admin</div>
  </div>

  <div class="footer-note">Password for all demo accounts: <code style="color:rgba(255,255,255,.45)">password</code></div>
</div>

<script>
async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errMsg');
  err.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Authenticating…';

  try {
    const r = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        login:    document.getElementById('loginInput').value.trim(),
        password: document.getElementById('passInput').value
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Login failed');

    const access = d.user.portal_access;
    if (access !== 'backoffice' && access !== 'all') {
      throw new Error('This account does not have backoffice access.');
    }
    localStorage.setItem('ps_token', d.token);
    window.location.href = '/portals/backoffice.html';
  } catch(e) {
    err.textContent = '⚠️ ' + e.message;
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign In to Backoffice';
  }
}
</script>
</body>
</html>
